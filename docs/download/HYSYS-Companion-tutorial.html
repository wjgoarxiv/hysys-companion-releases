.wb-update__row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-8) var(--sp-12); }
.wb-update__stack { display: grid; gap: var(--sp-12); min-width: 0; }
.wb-update__found { display: grid; gap: var(--sp-12); min-width: 0; padding: var(--sp-12) var(--sp-16); background: var(--c-info-wash); border: var(--bw-surface) solid var(--c-frame); animation: ui-enter var(--dur-enter) var(--ease-out) backwards; }
.wb-update__title { font-family: var(--font-mono); font-size: var(--fs-base); }
.wb-update__meta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--sp-4) var(--sp-16); margin: 0; font-size: var(--fs-sm); }
.wb-update__meta dt { color: var(--c-ink-3); }
.wb-update__meta dd { margin: 0; }
.wb-update__notes { display: grid; gap: var(--sp-4); min-width: 0; }
.wb-update__notes ul { margin: 0; padding-left: var(--sp-16); display: grid; gap: var(--sp-4); font-size: var(--fs-sm); overflow-wrap: anywhere; }
.wb-update__sha { display: grid; gap: var(--sp-4); min-width: 0; }
.wb-update__sha code, .wb-update__details code { font-family: var(--font-mono); font-size: var(--fs-xs); overflow-wrap: anywhere; word-break: break-all; }
.wb-update__details summary { cursor: pointer; font-size: var(--fs-sm); }
.wb-update__confirm { gap: var(--sp-8); }
.wb-update__gauge { display: grid; gap: var(--sp-8); }
.wb-update__gauge-head, .wb-update__gauge-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--sp-4) var(--sp-12); }
.wb-update__meter { height: var(--sp-12); border: var(--bw-surface) solid var(--c-frame); background: var(--c-surface); }
.wb-update__meter[data-indeterminate] > span { width: 25%; transform: none; animation: wb-install-sweep calc(var(--dur-enter) * 8) var(--ease-linear) infinite; }

/* The install overlay sits above everything, including a full-screen PFD, and blocks clicks until the app is replaced. */
.wb-install-overlay { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; padding: var(--sp-16); background: color-mix(in srgb, var(--c-canvas) 88%, transparent); animation: ui-enter var(--dur-enter) var(--ease-out) backwards; }
.wb-install-card { width: min(100%, calc(var(--sp-96) * 4)); background: var(--c-surface); border: var(--bw-surface) solid var(--c-frame); outline: none; }
.wb-install-card__body { display: grid; gap: var(--sp-12); padding: var(--sp-16); }
.wb-install-card__body p { margin: 0; }
.wb-install-bar { display: block; height: var(--sp-12); overflow: hidden; border: var(--bw-surface) solid var(--c-frame); background: var(--c-sunken); }
.wb-install-bar > span { display: block; width: 25%; height: 100%; background: var(--c-accent); animation: wb-install-sweep calc(var(--dur-enter) * 8) var(--ease-linear) infinite; }
@keyframes wb-install-sweep { from { transform: translateX(-100%); } to { transform: translateX(400%); } }
@media (prefers-reduced-motion: reduce) {
  .wb-install-bar > span, .wb-update__meter[data-indeterminate] > span { animation: none; transform: none; width: 100%; }
  .wb-update-pill[data-wb-update-pill="update"] .wb-update-pill__dot { animation: none; }
}

/* ---------- Follow-along tutorial ---------- */
/* The rail entry reads like the nav links under it. */
.wb-rail__tutorial { appearance: none; display: block; width: 100%; min-height: 36px; padding: var(--sp-8) var(--sp-12); border: 0; background: none; color: var(--c-ink-2); font: inherit; text-align: left; cursor: pointer; transition: color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out); }
.wb-rail__tutorial:hover { background: var(--c-sunken); color: var(--c-ink); }
.wb-rail__tutorial:focus-visible { outline: var(--bw-rule) solid var(--c-focus); outline-offset: -2px; }
/* The spotlight: a ring on the element the step is about; everything else dims a little but stays clickable.
   Above the full-screen flowsheet (210), below the start-up and closing screens (300). */
.wb-coach-spot { position: fixed; z-index: 215; pointer-events: none; border: var(--bw-rule) solid var(--c-accent); border-radius: var(--radius-sm); box-shadow: 0 0 0 100vmax color-mix(in srgb, var(--c-canvas) 45%, transparent); }
.wb-coach { position: fixed; z-index: 216; display: grid; gap: var(--sp-8); padding: var(--sp-16); border: var(--bw-surface) solid var(--c-frame); border-top: var(--bw-rule) solid var(--c-accent); background: var(--c-surface); color: var(--c-ink); box-shadow: 0 var(--sp-8) var(--sp-24) color-mix(in srgb, var(--c-ink) 18%, transparent); animation: ui-enter var(--dur-enter) var(--ease-out) backwards; }
.wb-coach--invite { right: var(--sp-16); bottom: var(--sp-16); width: min(calc(var(--sp-96) * 4), calc(100vw - var(--sp-32))); }
.wb-coach__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8); }
.wb-coach__kicker { margin: 0; font-family: var(--font-meta); font-size: var(--fs-xs); letter-spacing: 0.04em; text-transform: uppercase; color: var(--c-ink-3); }
.wb-coach__close { appearance: none; display: inline-grid; place-items: center; width: var(--sp-32); height: var(--sp-32); border: 0; background: none; color: var(--c-ink-2); font-size: var(--fs-lg); cursor: pointer; }
.wb-coach__close:hover { color: var(--c-ink); background: var(--c-sunken); }
.wb-coach__track { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; }
.wb-coach__track span { height: var(--sp-4); background: var(--c-line); }
.wb-coach__track span[data-state="done"] { background: var(--c-positive); }
.wb-coach__track span[data-state="now"] { background: var(--c-accent); }
.wb-coach__title { margin: 0; font-size: var(--fs-md); font-weight: var(--fw-strong); line-height: var(--lh-tight); }
.wb-coach__title:focus { outline: none; }
.wb-coach__body { margin: 0; font-size: var(--fs-sm); line-height: var(--lh-body); color: var(--c-ink-2); overflow-wrap: anywhere; }
.wb-coach__check { margin: 0; display: flex; gap: var(--sp-8); align-items: baseline; padding: var(--sp-8); background: var(--c-sunken); font-size: var(--fs-sm); color: var(--c-ink-2); }
.wb-coach__check.is-done { background: var(--c-positive-wash); color: var(--c-positive); }
.wb-coach > .ui-btn { justify-self: start; }
.wb-coach__actions { display: flex; justify-content: flex-end; gap: var(--sp-8); }
@media (prefers-reduced-motion: reduce) { .wb-coach { animation: none; } }

/* New-case beacon in the rail and the panel tabs: the run is seen from every screen. Tone = what the run needs now. */
.ui-navlist a:has(.wb-beacon) { position: relative; }
/* Rail: the state goes on its own line under the name, so the name never wraps and the state is never cut. */
.ui-navlist a:has(.wb-beacon:not(.wb-beacon--compact)) { flex-wrap: wrap; row-gap: var(--sp-4); align-content: center; padding-block: var(--sp-8); white-space: nowrap; }
.wb-beacon:not(.wb-beacon--compact) { flex-basis: 100%; margin-left: 0; }
.wb-beacon { --tone: var(--c-info); --tone-wash: var(--c-info-wash); display: inline-flex; align-items: center; gap: var(--sp-8); margin-left: auto; min-width: 0; font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: var(--fw-strong); color: var(--tone); white-space: nowrap; }
.wb-beacon[data-tone="waiting"] { --tone: var(--c-warning); --tone-wash: var(--c-warning-wash); }
.wb-beacon[data-tone="ready"], .wb-beacon[data-tone="done"] { --tone: var(--c-positive); --tone-wash: var(--c-positive-wash); }
.wb-beacon[data-tone="stopped"] { --tone: var(--c-negative); --tone-wash: var(--c-negative-wash); }
.wb-beacon__text { padding: 0 var(--sp-4); background: var(--tone-wash); line-height: 20px; font-family: var(--font-text-ko); }
.wb-beacon__text .ui-num { font-family: var(--font-mono); }
.wb-beacon__mark { position: relative; flex: none; width: 12px; height: 12px; border: var(--bw-surface) solid var(--tone); background: var(--tone-wash); }
.wb-beacon__mark > span { position: absolute; inset: 2px; background: var(--tone); }
/* Working: the inner block turns and a ring grows out of the mark. */
.wb-beacon[data-tone="running"] .wb-beacon__mark > span { animation: wb-beacon-turn calc(var(--dur-pop) * 5) var(--ease-linear) infinite; }
.wb-beacon[data-tone="running"] .wb-beacon__mark::after, .wb-beacon[data-tone="waiting"] .wb-beacon__mark::after { content: ""; position: absolute; inset: -4px; border: var(--bw-surface) solid var(--tone); opacity: 0; pointer-events: none; animation: wb-steps-pulse calc(var(--dur-enter) * 11) var(--ease-out) infinite; }
/* Waiting on the person: a blink that asks for a look. */
.wb-beacon[data-tone="waiting"] .wb-beacon__mark > span { animation: wb-beacon-blink calc(var(--dur-pop) * 5) var(--ease) infinite; }
.wb-beacon__bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; background: var(--tone-wash); }
.wb-beacon__bar > span { position: relative; display: block; width: 100%; height: 100%; background: var(--tone); transform-origin: left center; transition: transform var(--dur-pop) var(--ease-out); overflow: hidden; }
.wb-beacon__bar > span::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c-surface) 70%, transparent), transparent); animation: wb-install-sweep calc(var(--dur-enter) * 8) var(--ease-linear) infinite; }
.wb-beacon--compact { gap: var(--sp-4); margin-left: var(--sp-4); }
.wb-beacon__count { color: var(--tone); }
.ui-navlist a:has(.wb-beacon[data-tone="running"]):not([aria-current="page"]) { color: var(--c-ink); }
.ui-navlist a:has(.wb-beacon[data-tone="waiting"]):not([aria-current="page"]) { background: var(--c-warning-wash); color: var(--c-ink); }
@keyframes wb-beacon-turn { to { transform: rotate(360deg); } }
@keyframes wb-beacon-blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) {
  .wb-beacon .wb-beacon__mark > span, .wb-beacon .wb-beacon__mark::after, .wb-beacon__bar > span::after { animation: none; }
  .wb-beacon[data-tone="running"] .wb-beacon__mark > span { inset: 2px 5px 2px 2px; }
  .wb-beacon__bar > span { transition: none; }
}

/* Edit the draft: words and hand edits, side by side with the drawing above. */
.wb-revise { display: grid; gap: var(--sp-16); padding: var(--sp-16); border: var(--bw-surface) solid var(--c-frame); background: var(--c-surface); }
.wb-revise--closed { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-12); padding: var(--sp-12) var(--sp-16); border-style: dashed; background: var(--c-sunken); }
.wb-revise__ask { margin: 0; font-size: var(--fs-md); color: var(--c-ink-2); }
.wb-revise__head { display: grid; gap: var(--sp-4); }
.wb-revise__title { margin: 0; font-family: var(--font-heading); font-size: var(--fs-md); text-transform: var(--meta-case); letter-spacing: var(--track-label); }
:lang(ko) .wb-revise__title { font-family: var(--font-heading-ko); text-transform: none; letter-spacing: 0; }
.wb-revise__head .ui-meta { margin: 0; }
.wb-revise__hand { display: grid; gap: var(--sp-12); }
.wb-revise__hand > .ui-field__label { margin: 0; }
.wb-revise__tools { display: flex; width: 100%; }
.wb-revise__tools button { flex: 1 1 auto; justify-content: center; }
.wb-revise__glyph { font-family: var(--font-mono); font-weight: var(--fw-strong); color: var(--c-accent); }
.wb-revise__form { display: grid; gap: var(--sp-12); grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); align-items: end; padding: var(--sp-12); border-left: var(--bw-rule) solid var(--c-accent); background: var(--c-sunken); }
.wb-revise__form .ui-field { min-width: 0; }
.wb-revise__add { justify-self: start; min-height: 44px; }
.wb-revise__list { display: grid; gap: var(--sp-8); }
.wb-revise__list .ui-meta { margin: 0; }
.wb-revise__edits { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; border: var(--bw-surface) solid var(--c-line); }
.wb-revise__edits li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-12); align-items: center; padding: var(--sp-4) var(--sp-4) var(--sp-4) var(--sp-12); border-top: 1px solid var(--c-line); }
.wb-revise__edits li:first-child { border-top: 0; }
.wb-revise__n { font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: var(--fw-strong); color: var(--c-info); }
.wb-revise__line { overflow-wrap: anywhere; font-size: var(--fs-md); }
.wb-revise__actions .ui-meta { flex: 1 1 220px; }
.wb-revise__badge { margin: 0 0 var(--sp-8); }
@media (max-width: 560px) { .wb-revise__tools button { flex: 1 1 calc(50% - var(--sp-4)); } .wb-revise__add { justify-self: stretch; } }

/* "자리 비운 사이": what a New case run did while the window was away. */
.wb-away { gap: var(--sp-8); }
.wb-away__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8); }
.wb-away .wb-away__head .ui-btn { justify-self: auto; }
.wb-away__rows { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-4); }
.wb-away__next { margin: 0; font-weight: 600; }

/* app: agent.css */
/* Agent answer, change-request card, diff and history. Tokens only. */
.wb-agent { display: grid; gap: var(--sp-12); align-content: start; min-width: 0; }
.wb-agent--column { min-width: 0; }
.wb-agent__idle { display: grid; gap: var(--sp-12); min-width: 0; }

.wb-cr, .wb-answer, .wb-agent__idle, .wb-diff, .wb-hist { grid-template-columns: minmax(0, 1fr); }
.wb-cr, .wb-answer { display: grid; gap: var(--sp-12); min-width: 0; }
.wb-cr .ui-code { overflow-wrap: anywhere; }
.wb-cr__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-8); }
.wb-cr__tags { display: inline-flex; flex-wrap: wrap; gap: var(--sp-4); }
.wb-cr__what, .wb-answer__q, .wb-cr__reason, .wb-cr__repair { margin: 0; overflow-wrap: anywhere; }
.wb-cr__verdict { margin: 0; font-weight: var(--fw-strong); }
.wb-cr__actions { display: flex; flex-wrap: wrap; gap: var(--sp-8); }
.wb-suggest { display: grid; gap: var(--sp-8); min-width: 0; }
.wb-suggest .wb-subhead { margin: 0; }
/* Example requests read like a command palette: one row each, a group glyph, the words, and an enter mark on hover. */
.wb-suggest__group { display: grid; gap: var(--sp-4); }
.wb-suggest__label { font-family: var(--font-meta); font-size: var(--fs-xs); letter-spacing: 0.04em; text-transform: uppercase; color: var(--c-ink-3); }
.wb-suggest__list { display: grid; margin: 0; padding: 0; list-style: none; border: var(--bw-surface) solid var(--c-line); background: var(--c-surface); }
.wb-suggest__list > li { min-width: 0; }
.wb-suggest__list > li + li { border-top: var(--bw-surface) solid var(--c-line); }
.wb-suggest__chip { appearance: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--sp-8); width: 100%; min-height: 40px; padding: var(--sp-8) var(--sp-12); border: 0; background: transparent; color: var(--c-ink); font: inherit; font-size: var(--fs-sm); text-align: left; cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out); }
.wb-suggest__chip:hover { background: var(--c-sunken); box-shadow: inset var(--bw-rule) 0 0 var(--c-accent); }
.wb-suggest__chip:focus-visible { outline: var(--bw-rule) solid var(--c-focus); outline-offset: -2px; }
.wb-suggest__glyph { display: inline-grid; place-items: center; width: var(--sp-20); height: var(--sp-20); border: var(--bw-surface) solid var(--c-line-strong); font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--c-ink-2); }
.wb-suggest__group[data-group="ask"] .wb-suggest__glyph { border-color: var(--c-info); color: var(--c-info); }
.wb-suggest__group[data-group="change"] .wb-suggest__glyph { border-color: var(--c-accent); color: var(--c-accent); }
.wb-suggest__group[data-group="create"] .wb-suggest__glyph { border-color: var(--c-positive); color: var(--c-positive); }
.wb-suggest__text { min-width: 0; overflow-wrap: anywhere; }
.wb-suggest__go { font-family: var(--font-mono); color: var(--c-ink-3); opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }
.wb-suggest__chip:hover .wb-suggest__go, .wb-suggest__chip:focus-visible .wb-suggest__go { opacity: 1; }
.wb-choose { display: grid; gap: var(--sp-8); }
.wb-choose p { margin: 0; }
.wb-choose__row { display: flex; flex-wrap: wrap; gap: var(--sp-8); }


.wb-cr__progress { display: grid; gap: var(--sp-4); animation: ui-enter var(--dur-enter) var(--ease-out) backwards; }
.wb-progress { display: block; height: var(--sp-4); background: var(--c-sunken); overflow: hidden; position: relative; }
.wb-progress::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 30%; background: var(--c-accent); animation: wb-progress-slide calc(var(--dur-enter) * 7) var(--ease) infinite; }
/* One-way sweep, left to right, again and again: reads as "moving forward", not as waiting. */
@keyframes wb-progress-slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
@media (prefers-reduced-motion: reduce) { .wb-progress::after { animation: none; width: 100%; opacity: 0.4; } }

.wb-answer__text { display: grid; gap: var(--sp-8); margin: 0; overflow-wrap: anywhere; font-size: var(--fs-md); line-height: var(--lh-body); }
.wb-md__p { margin: 0; }
.wb-md__list { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--sp-4); }
ul.wb-md__list > li { position: relative; padding-left: var(--sp-16); }
ul.wb-md__list > li::before { content: "›"; position: absolute; left: 0; color: var(--c-ink-3); font-family: var(--font-mono); }
ol.wb-md__list { counter-reset: wb-md; }
ol.wb-md__list > li { counter-increment: wb-md; position: relative; padding-left: var(--sp-24); }
ol.wb-md__list > li::before { content: counter(wb-md) "."; position: absolute; left: 0; color: var(--c-ink-3); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.wb-md__code { padding: 0 var(--sp-4); background: var(--c-sunken); font-family: var(--font-mono); font-size: 0.92em; overflow-wrap: anywhere; }

.wb-diff { display: grid; gap: var(--sp-12); min-width: 0; }
.wb-diff__title { margin: 0 0 var(--sp-4); font-size: var(--fs-sm); font-weight: var(--fw-strong); color: var(--c-ink-2); }
.wb-diff__list { display: grid; gap: var(--sp-4); margin: 0; padding: 0; list-style: none; }
.wb-diff__list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-4) var(--sp-8); }
.wb-diff__text { overflow-wrap: anywhere; }
.wb-diff__key { overflow-wrap: anywhere; }
.wb-diff__rel { display: block; font-size: var(--fs-sm); color: var(--c-ink-2); }
.wb-diff .ui-num { text-align: right; }

.wb-hist { display: grid; gap: var(--sp-8); min-width: 0; }
.wb-hist__list { display: grid; margin: 0; padding: 0; list-style: none; }
.wb-hist__item { transition: background-color var(--dur-fast) var(--ease), transform var(--dur-press) var(--ease-out); min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8); width: 100%; min-height: 44px; padding: var(--sp-8) var(--sp-4); border: 0; border-bottom: var(--bw-surface) solid var(--c-line); background: transparent; color: var(--c-ink); font: inherit; text-align: left; cursor: pointer; }
.wb-hist__item:hover { background: var(--c-sunken); }
.wb-hist__what { min-width: 0; overflow-wrap: anywhere; text-align: left; }

/* Panel layout: a full-height sheet over the screen */
.wb-agent-sheet { position: fixed; inset: 0; z-index: 40; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--c-canvas); }
.wb-agent-sheet__bar { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8); padding: var(--sp-4) var(--sp-8) var(--sp-4) var(--sp-12); background: var(--panel-head-bg); color: var(--panel-head-ink); border-bottom: var(--bw-rule) solid var(--c-frame); }
.wb-agent-sheet__bar .ui-btn { --btn-ink: var(--panel-head-ink); }
.wb-agent-sheet__body { overflow-y: auto; padding: var(--sp-12); min-width: 0; }



.wb-needs { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-8); padding: var(--sp-12); background: var(--c-sunken); border: var(--bw-surface) dashed var(--c-line-strong); }
.wb-needs__row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--sp-8); }
.wb-needs .ui-field { min-width: 0; }
.wb-needs .ui-btn { justify-self: start; }

/* Answer progress: which step of three, what was read, how long it has taken. */
.wb-ans-steps { display: grid; gap: var(--sp-8); padding: var(--sp-12); background: var(--c-sunken); border: var(--bw-surface) solid var(--c-line); min-width: 0; animation: ui-enter var(--dur-enter) var(--ease-out) backwards; }
.wb-ans-steps__now { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--sp-8); margin: 0; }
.wb-ans-steps__now .ui-status { font-size: var(--fs-base); white-space: normal; }
.wb-ans-steps__clock { flex: none; }
.wb-ans-steps__track { display: flex; flex-wrap: wrap; gap: var(--sp-4) var(--sp-12); margin: 0; padding: 0; list-style: none; font-size: var(--fs-sm); }
.wb-ans-steps__track li { display: inline-flex; align-items: center; gap: var(--sp-4); color: var(--c-ink-3); }
.wb-ans-steps__track li[data-step-state="done"] { color: var(--c-ink-2); }
.wb-ans-steps__track li[data-step-state="now"] { color: var(--c-ink); font-weight: var(--fw-strong); }
.wb-ans-steps__tools { display: flex; flex-wrap: wrap; gap: var(--sp-4); margin: 0; padding: 0; list-style: none; }
.wb-ans-steps__tools .ui-tag { text-transform: none; }
.wb-ans-steps__done { margin: 0; }
.wb-ans-steps__track [data-step-state="done"] .wb-steps__mark { border-color: var(--c-positive); background: var(--c-positive-wash); color: var(--c-positive); }
.wb-ans-steps__track [data-step-state="now"] .wb-steps__mark { border-color: var(--c-info); background: var(--c-info); color: var(--c-surface); animation: wb-ans-ring calc(var(--dur-enter) * 6) var(--ease-out) infinite; }
/* The current step breathes: a ring that grows and fades, so a long wait still reads as moving. */
@keyframes wb-ans-ring { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c-info) 55%, transparent); } to { box-shadow: 0 0 0 var(--sp-8) transparent; } }
@media (prefers-reduced-motion: reduce) { .wb-ans-steps__track [data-step-state="now"] .wb-steps__mark { animation: none; } }

/* tutorial */
/* Tutorial chrome around the mocks. The mocks themselves use the app's own ui-/wb-/tc- classes and tokens
   (inlined above from workbench/src/theme), so they look and move like the real screens. Tokens only. */
html { scroll-padding-top: 72px; }
body { min-height: 100vh; overflow-x: hidden; }
body:lang(ko) { font-family: var(--font-text-ko); }
.tut-mock, .tut-mock .ui-meta, .tut-mock .wb-steps { font-family: var(--font-text-ko); }

/* ---------- Top bar ---------- */
.tut-top { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-8) var(--sp-24);
  min-height: 56px; padding: var(--sp-8) var(--gutter); background: var(--c-canvas); border-bottom: var(--bw-rule) solid var(--c-frame); }
.tut-top__brand { font-family: var(--font-mono); font-weight: var(--fw-strong); font-size: var(--fs-md); white-space: nowrap; }
.tut-top__brand .tc-brand__prompt { color: var(--c-accent-2-ink); }
.tut-top__sub { font-family: var(--font-text-ko); font-weight: var(--fw-medium); color: var(--c-ink-2); margin-left: var(--sp-8); }
.tut-top__progress { flex: 1 1 200px; display: flex; align-items: center; gap: var(--sp-12); min-width: 0; }
.tut-top__count { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--c-ink-2); white-space: nowrap; }
.tut-top__intro { font-family: var(--font-text-ko); font-size: var(--fs-sm); font-weight: var(--fw-strong); color: var(--c-accent-ink); white-space: nowrap; }
.tut-meter { flex: 1; height: 8px; background: var(--c-sunken); border: 1px solid var(--c-line); min-width: 80px; }
.tut-meter > span { display: block; height: 100%; width: 100%; transform: scaleX(0); transform-origin: left center; background: var(--c-accent-2); transition: transform var(--dur-ui) steps(3, end); }

/* A visible switch: track and thumb, square like the rest of the app. */
.tut-switch { display: inline-flex; align-items: center; gap: var(--sp-8); min-height: 44px; cursor: pointer; position: relative; font-size: var(--fs-sm); font-weight: var(--fw-medium); }
.tut-switch input { position: absolute; opacity: 0; width: 44px; height: 26px; right: 0; margin: 0; cursor: pointer; }
.tut-switch__track { position: relative; width: 48px; height: 26px; border: var(--bw-control) solid var(--c-control); background: var(--c-sunken); flex: none; }
.tut-switch__thumb { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: var(--c-control); transition: transform var(--dur-fast) steps(3, end); }
.tut-switch input:checked + .tut-switch__track { background: var(--c-accent); border-color: var(--c-accent); }
.tut-switch input:checked + .tut-switch__track .tut-switch__thumb { transform: translateX(22px); background: var(--c-on-accent); }
.tut-switch input:focus-visible + .tut-switch__track { outline: 2px solid var(--c-focus); outline-offset: 2px; }

/* ---------- Layout ---------- */
.tut-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-16); padding: var(--sp-16) var(--gutter) var(--sp-64); max-width: 1440px; margin: 0 auto; }
@media (min-width: 1024px) { .tut-layout { grid-template-columns: 248px minmax(0, 1fr); gap: var(--sp-32); padding-top: var(--sp-24); } }

.tut-path__box { border: var(--bw-surface) solid var(--c-frame); background: var(--c-surface); }
.tut-path__summary { min-height: 44px; display: flex; align-items: center; padding: 0 var(--sp-16); cursor: pointer; font-weight: var(--fw-medium); font-size: var(--fs-md); }
@media (min-width: 1024px) {
  .tut-path { position: sticky; top: 80px; align-self: start; max-height: calc(100vh - 96px); overflow-y: auto; }
  .tut-path__summary { display: none; }
}
.tut-path__list { list-style: none; margin: 0; padding: var(--sp-8); display: grid; gap: 2px; }
.tut-path__chap { margin: var(--sp-12) var(--sp-8) var(--sp-4); font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--c-ink-3); }
.tut-path__chap:first-child { margin-top: var(--sp-4); }
.tut-path__item { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--sp-8); align-items: center; width: 100%; min-height: 40px;
  padding: var(--sp-4) var(--sp-8); border: 0; background: transparent; color: var(--c-ink-2); font: inherit; font-size: var(--fs-sm); text-align: left; cursor: pointer; }
.tut-path__item:hover { background: var(--c-sunken); color: var(--c-ink); }
.tut-path__item[aria-current="step"] { background: var(--c-sunken); color: var(--c-ink); box-shadow: inset 3px 0 0 var(--c-accent); font-weight: var(--fw-medium); }
.tut-path__mark { display: inline-grid; place-items: center; width: 22px; height: 22px; border: var(--bw-surface) solid var(--c-line-strong); font-family: var(--font-mono); font-size: var(--fs-xs); }
.tut-path__item[data-done] .tut-path__mark { background: var(--c-positive-wash); border-color: var(--c-positive); color: var(--c-positive); }
.tut-path__item[aria-current="step"] .tut-path__mark { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-on-accent); }

/* ---------- Stage ---------- */
.tut-stage { min-width: 0; display: grid; gap: var(--sp-12); align-content: start; }
.tut-kicker { font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--c-accent-2-ink); }
.tut-kicker span { font-family: var(--font-text-ko); letter-spacing: 0; }
.tut-goal { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 4.6vw, 34px); line-height: 1.2; letter-spacing: -0.01em; outline: none; }
.tut-lead { max-width: 72ch; color: var(--c-ink-2); font-size: var(--fs-base); }
.tut-lead strong { color: var(--c-ink); }
.tut-todo { border-left: var(--bw-rule) solid var(--c-accent-2); padding: var(--sp-4) 0 var(--sp-4) var(--sp-16); }
.tut-todo__title { font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--c-ink-3); margin-bottom: var(--sp-4); }
.tut-todo__list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-4); counter-reset: todo; }
.tut-todo__list li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--sp-8); align-items: start; font-size: var(--fs-md); line-height: 1.5; counter-increment: todo; }
.tut-todo__list li::before { content: counter(todo); display: inline-grid; place-items: center; width: 22px; height: 22px; margin-top: 1px; border: var(--bw-surface) solid var(--c-line-strong); font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--c-ink-2); }
.tut-todo__list li[data-done]::before { content: "✓"; background: var(--c-positive); border-color: var(--c-positive); color: var(--c-on-accent-2); }
.tut-todo__list li[data-done] { color: var(--c-ink-3); }
.tut-todo__list li[data-done] .tut-todo__text { text-decoration: line-through; text-decoration-thickness: 1px; }

.tut-say { min-height: 1.6em; font-size: var(--fs-md); color: var(--c-accent-2-ink); font-weight: var(--fw-medium); }
.tut-say[data-tone="info"] { color: var(--c-info); }
.tut-nav { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-12); padding-top: var(--sp-8); border-top: 1px solid var(--c-line); }
.tut-nav #tut-next { margin-left: auto; }
.tut-nav__note { flex-basis: 100%; text-align: right; }
@media (max-width: 520px) { .tut-nav #tut-next { margin-left: 0; flex: 1 1 100%; } .tut-nav__note { text-align: left; } }

/* ---------- The mock window ---------- */
.tut-mock { min-width: 0; }
.mk { border: var(--bw-surface) solid var(--c-frame); background: var(--c-canvas); background-image: var(--canvas-pattern); background-size: var(--canvas-pattern-size); min-width: 0; }
.mk-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8); min-height: 30px; padding: 0 var(--sp-12); background: var(--c-ink); color: var(--c-canvas); font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: var(--track-label); }
.mk-bar__keys { letter-spacing: 0.3em; }
.mk-app { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.mk-rail { background: var(--c-surface); border-bottom: var(--bw-rule) solid var(--c-frame); padding: var(--sp-8); min-width: 0; }
.mk-rail .wb-brand { display: none; }
.mk-rail .ui-navlist { display: flex; flex-wrap: wrap; gap: 2px; }
.mk-rail .ui-navlist button { min-height: 36px; font-size: var(--fs-sm); padding: 0 var(--sp-8); }
.mk-rail .ui-navlist [aria-current="page"] { box-shadow: inset 0 -2px 0 var(--c-accent); }
@media (min-width: 760px) {
  .mk-app { grid-template-columns: 168px minmax(0, 1fr); }
  .mk-rail { border-bottom: 0; border-right: var(--bw-rule) solid var(--c-frame); padding: var(--sp-16) var(--sp-8); }
  .mk-rail .wb-brand { display: block; font-family: var(--font-mono); font-weight: var(--fw-strong); font-size: var(--fs-sm); margin: 0 var(--sp-8) var(--sp-16); white-space: nowrap; }
  .mk-rail .ui-navlist { display: grid; }
  .mk-rail .ui-navlist button { width: 100%; text-align: left; }
  .mk-rail .ui-navlist [aria-current="page"] { box-shadow: inset 2px 0 0 var(--c-accent); }
}
.mk-main { min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.mk-top { position: static; min-height: 52px; padding: var(--sp-8) var(--sp-16); }
.mk-top .wb-casehead__name { font-family: var(--font-mono); }
.mk-screen { padding: var(--sp-16); min-width: 0; min-height: 360px; display: grid; gap: var(--sp-16); align-content: start; }
@media (min-width: 760px) { .mk-screen { padding: var(--sp-20) var(--sp-24); } }
.mk-screen > * { min-width: 0; }
.mk .wb-status .tc-status__inner { padding: 0 var(--sp-16); }
.mk .wb-status .tc-status__inner > span { white-space: normal; }
.mk-split { display: grid; gap: var(--sp-16); grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1100px) { .mk-split--agent { grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); } }
.mk-agent { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; }
.mk-agent .wb-agent-column__body { padding: var(--sp-16); display: grid; gap: var(--sp-12); max-height: none; }
.mk-agent .wb-agent-column__input { padding: var(--sp-12) var(--sp-16); border-top: 1px solid var(--c-line); }

/* A HYSYS window the person uses beside the app (only in the "직접 켠 HYSYS" step). */
.mk-hysys { border: var(--bw-surface) solid var(--c-line-strong); background: var(--c-surface); }
.mk-hysys__bar { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8); min-height: 30px; padding: 0 var(--sp-12); background: var(--c-sunken); font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: var(--track-label); color: var(--c-ink-2); }
.mk-hysys__body { display: grid; gap: var(--sp-8); padding: var(--sp-12) var(--sp-16); }
.mk-hysys[data-closed] .mk-hysys__body { color: var(--c-ink-3); }

/* The draft drawing: boxes and dashed streams, drawn in steps the way the app paints a draft. */
.mk-pfd { border: var(--bw-surface) solid var(--c-line); background: var(--c-sunken); background-image: var(--canvas-pattern); background-size: var(--canvas-pattern-size); }
.mk-pfd__tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-4) var(--sp-8); padding: var(--sp-8) var(--sp-12); border-bottom: 1px solid var(--c-line); background: var(--c-surface); font-size: var(--fs-sm); }
.mk-pfd__tools .mk-pfd__legend { margin-right: auto; color: var(--c-ink-2); }
.mk-pfd__canvas { overflow-x: auto; padding: var(--sp-16) var(--sp-8); }
.mk-pfd svg { display: block; width: 100%; min-width: 560px; height: auto; max-width: 900px; margin: 0 auto; }
.mk-pfd .pf-box { fill: var(--c-surface); stroke: var(--c-line-strong); stroke-width: 2; }
.mk-pfd .pf-node { cursor: pointer; }
.mk-pfd .pf-node:hover .pf-box, .mk-pfd .pf-node:focus-visible .pf-box, .mk-pfd .pf-node[aria-pressed="true"] .pf-box { stroke: var(--c-accent); stroke-width: 3; }
.mk-pfd .pf-node:focus-visible { outline: none; }
.mk-pfd .pf-node:focus-visible .pf-box { stroke: var(--c-focus); }
.mk-pfd .pf-name { font-family: var(--font-mono); font-weight: 700; font-size: 14px; fill: var(--c-ink); }
.mk-pfd .pf-kind { font-family: var(--font-text-ko); font-size: 11px; fill: var(--c-ink-3); }
.mk-pfd .pf-term { fill: var(--c-surface); stroke: var(--c-line-strong); stroke-width: 1.5; }
.mk-pfd .pf-term-t { font-family: var(--font-mono); font-size: 11px; fill: var(--c-ink-2); }
.mk-pfd .pf-edge { fill: none; stroke: var(--c-ink-3); stroke-width: 1.5; stroke-dasharray: 5 4; }
.mk-pfd .pf-edge--rcy { stroke: var(--c-accent-2); }
.mk-pfd .pf-arrow { fill: var(--c-ink-3); }
.mk-pfd .pf-arrow--rcy { fill: var(--c-accent-2); }
.mk-pfd .pf-lbl { font-family: var(--font-mono); font-size: 10px; fill: var(--c-ink-2); paint-order: stroke; stroke: var(--c-sunken); stroke-width: 4px; }
.mk-pfd [data-draw] { opacity: 0; }
.mk-pfd[data-drawn] [data-draw] { opacity: 1; transition: opacity var(--dur-ui) steps(3, end); transition-delay: calc(var(--i, 0) * 120ms); }
.mk-sheet { background: var(--c-surface); border: var(--bw-surface) solid var(--c-ink); }
.mk-sheet__title { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 0; border-top: var(--bw-surface) solid var(--c-ink); font-size: var(--fs-xs); }
.mk-sheet__title > span { padding: var(--sp-4) var(--sp-8); border-left: 1px solid var(--c-line-strong); white-space: nowrap; }
.mk-sheet__title > span:first-child { border-left: 0; font-weight: var(--fw-strong); white-space: normal; }

/* Demo PFD thumbnails and the picked drawing. */
.mk-demos { display: grid; gap: var(--sp-8); grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); list-style: none; margin: 0; padding: 0; }
.mk-demo { display: grid; gap: var(--sp-4); width: 100%; padding: var(--sp-8); border: var(--bw-surface) solid var(--c-line); background: var(--c-surface); color: var(--c-ink); font: inherit; font-size: var(--fs-sm); text-align: left; cursor: pointer; }
.mk-demo:hover { border-color: var(--c-line-strong); }
.mk-demo[aria-pressed="true"] { border-color: var(--c-accent); box-shadow: inset 0 0 0 1px var(--c-accent); }
.mk-demo svg { width: 100%; height: auto; background: var(--c-sunken); }
.mk-demo svg rect { fill: var(--c-surface); stroke: var(--c-ink-3); stroke-width: 1.5; }
.mk-demo svg path { fill: none; stroke: var(--c-ink-3); stroke-width: 1.5; }

/* Small helpers for the mocks. */
.mk-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-8) var(--sp-16); padding: var(--sp-12) 0; border-bottom: 1px solid var(--c-line); }
.mk-row:last-child { border-bottom: 0; }
.mk-row__name { font-weight: var(--fw-strong); }
.mk-tabs { display: flex; flex-wrap: wrap; gap: var(--sp-4); }
.mk-chat-you { justify-self: end; max-width: 90%; padding: var(--sp-8) var(--sp-12); background: var(--c-accent-wash); border: 1px solid var(--c-line); }
.mk-caption { font-size: var(--fs-sm); color: var(--c-ink-3); }
.mk-flow { display: grid; gap: var(--sp-8); grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); list-style: none; margin: 0; padding: 0; counter-reset: flow; }
.mk-flow li { counter-increment: flow; border: var(--bw-surface) solid var(--c-line); background: var(--c-surface); padding: var(--sp-12); font-size: var(--fs-sm); display: grid; gap: var(--sp-4); }
.mk-flow li::before { content: counter(flow, decimal-leading-zero); font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--c-accent-2-ink); }
.mk-flow li strong { font-size: var(--fs-md); }
.mk-flow li[data-key] { border-color: var(--c-accent-2); }
.mk .wb-item { margin-top: var(--sp-12); }
.mk .wb-assume ul { display: grid; gap: var(--sp-8); padding-left: var(--sp-20); margin: var(--sp-4) 0 0; }
.mk .wb-draft__body { padding: 0 var(--sp-16) var(--sp-16); display: grid; gap: var(--sp-16); }
.mk .wb-draft__foot { display: grid; gap: var(--sp-12); }
.mk .wb-entries { list-style: none; margin: 0; padding: 0; }

/* Where autoplay is about to press. */
.tut-poke { outline: 3px solid var(--c-accent-2) !important; outline-offset: 3px; }

/* Rotating progress line under a running step. */
.mk-line { display: block; }
.mk-line[data-turn] { animation: ui-step-in var(--dur-ui) var(--ease-out) backwards; }

@media (prefers-reduced-motion: reduce) {
  .mk-pfd [data-draw] { opacity: 1; }
  .mk-pfd[data-drawn] [data-draw] { transition: none; }
  .mk-line[data-turn] { animation: none; }
  .tut-meter > span, .tut-switch__thumb { transition: none; }
  .tut-mock *, .tut-mock *::before, .tut-mock *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* The app's coach card floats over the window; inside a practice screen it sits in the flow. */
.mk .wb-coach { position: static; width: auto; max-width: 560px; box-shadow: none; z-index: auto; }
.mk .wb-casehead__name--none { font-family: var(--font-text-ko); }
/* Hangul in a tracked mono label reads as spaced-out letters; Korean labels keep the Korean face and almost no tracking. */
.tut-todo__title, .tut-path__chap, .tut-kicker span { font-family: var(--font-text-ko); letter-spacing: 0.02em; }
.mk .tc-status { font-family: var(--font-text-ko); letter-spacing: 0.02em; }
.tut-path__item { min-height: 36px; }
.mk-pfd svg[data-fit] { min-width: 0; }
.mk .wb-draft__body > *, .mk-pfd, .mk-sheet, .mk-pfd__canvas { min-width: 0; max-width: 100%; }
.mk-sheet__title { grid-template-columns: minmax(0, 1fr) auto; }
.mk-sheet__title > span:last-child { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--c-line-strong); }
@media (min-width: 640px) { .mk-sheet__title { grid-template-columns: minmax(0, 1fr) auto auto; } .mk-sheet__title > span:last-child { grid-column: auto; border-left: 1px solid var(--c-line-strong); border-top: 0; } }
.mk .wb-failure > [data-r] { justify-self: stretch; width: 100%; }

/* ---------- Guide: ring on the next control, soft dim on the rest of the practice screen, a bubble ---------- */
.tut-guide-toggle { white-space: nowrap; }
.tut-guide { position: fixed; z-index: 25; overflow: hidden; pointer-events: none; }
.tut-guide__ring { position: absolute; left: 0; top: 0; border: 3px solid var(--c-accent);
  box-shadow: 0 0 0 200vmax color-mix(in srgb, var(--c-canvas) 52%, transparent); pointer-events: none; }
.tut-guide__ring.is-travel { transition: transform 360ms var(--ease-out), width 360ms var(--ease-out), height 360ms var(--ease-out); }
.tut-guide__ring::after { content: ""; position: absolute; inset: -3px; border: 3px solid var(--c-accent); opacity: 0; animation: tut-ring-pulse 1.6s var(--ease-out) infinite; }
.tut-guide__ring.is-nudge::after { animation: tut-ring-nudge 0.9s var(--ease-out) 1, tut-ring-pulse 1.6s var(--ease-out) 0.9s infinite; }
@keyframes tut-ring-pulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.06); opacity: 0; } }
@keyframes tut-ring-nudge { 0% { transform: scale(1); opacity: 1; border-width: 5px; } 100% { transform: scale(1.16); opacity: 0; border-width: 5px; } }
.tut-bubble { position: fixed; left: 0; top: 0; z-index: 28; width: min(300px, calc(100vw - 24px)); display: grid; gap: var(--sp-4);
  padding: var(--sp-12) var(--sp-16); background: var(--c-surface); color: var(--c-ink); border: 2px solid var(--c-accent); border-top-width: 4px;
  font-family: var(--font-text-ko); font-size: var(--fs-sm); line-height: 1.5; }
.tut-bubble__verb { font-weight: var(--fw-strong); font-size: var(--fs-md); color: var(--c-accent-ink); }
.tut-bubble__text { color: var(--c-ink-2); }
.tut-bubble__example { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-8); color: var(--c-ink-2); }
.tut-bubble__example q { color: var(--c-ink); font-weight: var(--fw-medium); }
.tut-bubble__example[hidden] { display: none; }
.tut-bubble__arrow { position: absolute; left: calc(var(--arrow-x, 50%) - 8px); width: 14px; height: 14px; background: var(--c-surface); border: 2px solid var(--c-accent); transform: rotate(45deg); }
.tut-bubble[data-side="below"] .tut-bubble__arrow { top: -10px; border-right: 0; border-bottom: 0; }
.tut-bubble[data-side="above"] .tut-bubble__arrow { bottom: -9px; border-left: 0; border-top: 0; }
.tut-bubble.is-shake { animation: tut-shake 0.42s var(--ease-out) 1; }
@keyframes tut-shake { 0%, 100% { translate: 0 0; } 20% { translate: -6px 0; } 40% { translate: 6px 0; } 60% { translate: -4px 0; } 80% { translate: 3px 0; } }
.tut-bubble[data-side="below"].is-shake { animation-name: tut-shake-up; }
@keyframes tut-shake-up { 0%, 100% { translate: 0 0; } 25% { translate: 0 -6px; } 50% { translate: 0 2px; } 75% { translate: 0 -4px; } }
@media (prefers-reduced-motion: reduce) {
  .tut-guide__ring.is-travel { transition: none; }
  .tut-guide__ring::after, .tut-guide__ring.is-nudge::after { animation: none; opacity: 0; }
  .tut-bubble.is-shake { animation: none; }
}

</style>
</head>

<a class="ui-skip" href="#tut-main">본문으로 건너뛰기</a>
<header class="tut-top">
  <div class="tut-top__brand"><span class="tc-brand__prompt" aria-hidden="true">~/</span>hysys-companion <span class="tut-top__sub">따라 하기</span></div>
  <div class="tut-top__progress">
    <span class="tut-top__count ui-num" id="tut-count">1/14</span>
    <div class="tut-meter" role="progressbar" id="tut-meter" aria-label="전체 진행" aria-valuemin="0" aria-valuemax="14" aria-valuenow="0"><span id="tut-meter-fill"></span></div>
  </div>
  <a class="tut-top__intro" href="https://wjgoarxiv.github.io/hysys-companion-releases/#intro">소개 슬라이드</a>
  <button type="button" class="ui-btn ui-btn--sm ui-btn--quiet tut-guide-toggle" id="tut-guide">안내 끄기</button>
  <span class="ui-visually-hidden" id="tut-guide-note"></span>
  <label class="tut-switch">
    <span class="tut-switch__label">다크 모드</span>
    <input type="checkbox" role="switch" id="tut-theme">
    <span class="tut-switch__track" aria-hidden="true"><span class="tut-switch__thumb"></span></span>
  </label>
</header>

<div class="tut-layout">
  <nav class="tut-path" aria-label="배우는 순서">
    <details class="tut-path__box" id="tut-path-box">
      <summary class="tut-path__summary">전체 순서 보기</summary>
      <ol class="tut-path__list" id="tut-path"></ol>
    </details>
  </nav>

  <main class="tut-stage" id="tut-main">
    <p class="tut-kicker" id="tut-kicker"></p>
    <h1 class="tut-goal" id="tut-goal" tabindex="-1"></h1>
    <p class="tut-lead" id="tut-lead"></p>
    <section class="tut-todo" aria-labelledby="tut-todo-title">
      <h2 class="tut-todo__title" id="tut-todo-title">이렇게 해 보세요</h2>
      <ol class="tut-todo__list" id="tut-todo"></ol>
    </section>
    <div class="tut-mock" id="tut-mock" data-ui-moment="interactive-object"></div>
    <p class="tut-say" id="tut-say" role="status" aria-live="polite"></p>
    <div class="tut-nav">
      <button type="button" class="ui-btn ui-btn--sm ui-btn--quiet" id="tut-prev">← 이전</button>

<script>
"use strict";
/* HYSYS Companion interactive tutorial. Every step paints a practice copy of a real screen (app classes, app wording),
   waits for the person to do the step's actions, then unlocks "다음". "그냥 보기" presses the same buttons for them. */
(function () {
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const reducedQuery = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
  const reduced = () => reducedQuery.matches;
  const clockText = (seconds) => { const s = Math.max(0, Math.round(seconds)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

  /* ---------------- Theme switch ---------------- */
  const THEME_KEY = "hc-tutorial-theme";
  const themeInput = $("#tut-theme");
  const setTheme = (theme, remember) => {
    document.documentElement.setAttribute("data-theme", theme);
    themeInput.checked = theme === "dark";
    if (remember) { try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* storage blocked: the switch still works for this visit */ } }
  };
  setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light", false);
  themeInput.addEventListener("change", () => setTheme(themeInput.checked ? "dark" : "light", true));

  /* ---------------- App wording (workbench/src/i18n, Korean) ---------------- */
  const STAGE = { clarify: "요청 확인", intent: "요청 읽기", draft: "초안 만들기", refine: "빠진 정보 확인", design: "AI가 설계", preview: "미리보기 확인",
    verify: "계산 확인", template: "템플릿 준비", observe: "이미지 읽기", apply: "케이스 적용", open: "케이스 열기", approve: "승인", repair: "자동으로 고치기" };
  const WHAT = {
    clarify: "요청에 장치·원료·조건·목표가 다 있는지 봐요. AI도 HYSYS도 아직 쓰지 않아요.",
    intent: "문장에서 무엇을 만들지 읽어요. HYSYS는 아직 쓰지 않아요.",
    draft: "장치와 흐름의 첫 초안을 잡아요. HYSYS는 아직 쓰지 않아요.",
    refine: "계산에 필요한 값이 빠졌는지 봐요. 빠졌으면 여쭤볼게요.",
    design: "AI가 장치와 흐름을 설계하고 다른 AI가 검토해요. AI를 여러 번 부르는 단계라 시간이 걸릴 수 있어요.",
    preview: "HYSYS에 넣기 전에 빠진 연결과 값을 검사해요.",
    verify: "임시 복사본을 HYSYS에서 계산해 수렴하는지 봐요. 지금 열린 케이스는 바뀌지 않아요.",
    template: "고른 템플릿에 입력한 값을 채워요.",
    observe: "사진에서 장치와 흐름을 읽어요.",
    apply: "승인한 케이스를 파일로 만들어요.",
    open: "만든 케이스를 HYSYS에서 열어요.",
  };
  const MEAN = {
    clarify: "요청에 장치·원료·조건·목표가 다 있는지 봐요.", intent: "문장에서 무엇을 만들지 읽어요.", draft: "장치와 흐름의 첫 초안을 잡아요.",
    refine: "계산에 필요한 값이 빠졌는지 보고, 빠졌으면 여쭤봐요.", design: "AI가 장치와 흐름을 설계하고 다른 AI가 검토해요.",
    preview: "HYSYS에 넣기 전에 빠진 연결과 값을 검사해요.", verify: "임시 복사본에서 계산이 끝까지 맞는지 봐요. 지금 열린 케이스는 바뀌지 않아요.",
    template: "고른 템플릿에 입력한 값을 채워요.", observe: "사진에서 장치와 흐름을 읽어요.", approve: "결과를 보고 만들지 직접 정해요.",
    apply: "승인한 케이스를 파일로 만들어요.", open: "만든 케이스를 HYSYS에서 열어요.",
  };
  const USUAL = { observe: [20, 60], draft: [30, 90], refine: [10, 60], design: [60, 180], preview: [10, 40], verify: [30, 180], template: [5, 20], apply: [20, 60], open: [5, 20], clarify: [5, 20], intent: [10, 40] };
  const HEADS = { refine: "답이 필요할 수 있어요", approve: "직접 승인해요" };
  const span = (s) => (s < 60 ? `${s}초` : s % 60 === 0 ? `${s / 60}분` : `${Math.floor(s / 60)}분 ${s % 60}초`);
  const LAUNCH_LINES = ["HYSYS를 찾고 있어요…", "HYSYS를 시작하고 있어요…", "연결을 기다리고 있어요…"];
  const NOT_OWNED = "지금 켜진 HYSYS는 직접 켜신 것이라 앱이 복사본 확인에 쓸 수 없어요. 설계한 내용은 그대로 있어요.";
  const CLOSE_OWN = "열린 케이스를 저장하고 HYSYS를 닫은 뒤 'HYSYS 상태 다시 확인'을 누르면 'HYSYS 켜기'가 나와요. 앱으로 켠 다음 '다시 확인하고 열기'를 눌러 주세요.";
  const GUIDE_LAUNCH = "HYSYS가 설치되어 있지만 실행 중이 아니에요. 아래 버튼으로 실행해 주세요.";
  const REQUEST = "압축기 출구 일부를 입구로 되돌리는 리사이클 공정 만들어줘";
  const NAV = [["case", "케이스 홈"], ["problems", "문제"], ["versions", "버전"], ["studies", "스터디"], ["new", "새 케이스"], ["settings", "설정"]];

  /* ---------------- Mock building blocks ---------------- */
  function shell(o) {
    const nav = NAV.map(([id, label]) => `<li><button type="button" data-nav="${id}"${o.route === id ? ' aria-current="page"' : ""}>${label}</button></li>`).join("");
    const head = o.caseName
      ? `<section class="wb-casehead" aria-label="케이스 정보"><div class="ui-cluster"><strong class="wb-casehead__name">${esc(o.caseName)}</strong>
          <span class="wb-casehead__facts ui-cluster"><span class="ui-status ui-status--positive">수렴</span>
          <span class="ui-meta"><span class="ui-num">${o.units}</span> 유닛</span><span class="ui-meta"><span class="ui-num">${o.streams}</span> 스트림</span></span></div></section>`
      : `<section class="wb-casehead" aria-label="케이스 정보"><strong class="wb-casehead__name wb-casehead__name--none">열린 케이스 없음</strong></section>`;
    const pid = o.pid ? `<span><span class="tc-status__dot" data-ok="true" aria-hidden="true"></span> HYSYS PID <span class="ui-num" data-r="pid">${o.pid}</span> · ${o.owned === false ? "직접 연 HYSYS" : "이 앱이 연 HYSYS"}</span>`
      : `<span><span class="tc-status__dot" data-ok="false" aria-hidden="true"></span> HYSYS 연결 없음</span>`;
    return `<div class="mk" data-mk>
      <div class="mk-bar" aria-hidden="true"><span>hysys-companion.exe — 연습 화면</span><span class="mk-bar__keys">_ □ ×</span></div>
      <div class="mk-app">
        <nav class="mk-rail" aria-label="앱 화면 이동 (연습)"><div class="wb-brand"><span class="tc-brand__prompt">~/</span>hysys-companion</div><ul class="ui-navlist">${nav}</ul></nav>
        <div class="mk-main">
          <header class="ui-topbar wb-topbar mk-top">${head}<div class="ui-cluster" data-r="topright">${o.topRight || ""}</div></header>
          <div class="mk-screen" data-r="screen">${o.body}</div>
          <footer class="tc-status wb-status" aria-label="HYSYS와 AI 계정 상태"><div class="tc-status__inner" data-r="status">${pid}<span>OpenAI 로그인</span></div></footer>
        </div>
      </div>
    </div>`;
  }
  const statusLine = (pid, owned) => pid
    ? `<span><span class="tc-status__dot" data-ok="true" aria-hidden="true"></span> HYSYS PID <span class="ui-num">${pid}</span> · ${owned ? "이 앱이 연 HYSYS" : "직접 연 HYSYS"}</span><span>OpenAI 로그인</span>`
    : `<span><span class="tc-status__dot" data-ok="false" aria-hidden="true"></span> HYSYS 연결 없음</span><span>OpenAI 로그인</span>`;

  /* The progress card of a running new case: which step of how many, what it does, a turning activity line, the clock. */
  function stepsCard(api, host, plan) {
    host.innerHTML = `<section class="wb-steps" aria-label="진행 상황" data-newcase="steps">
      <span class="wb-steps__sweep" aria-hidden="true" data-r="sweep"><span></span></span>
      <p class="wb-steps__now" role="status" data-r="now"></p>
      <p class="ui-meta wb-steps__what" data-r="what"></p>
      <p class="wb-steps__activity" data-r="activity"></p>
      <p class="ui-meta ui-num wb-steps__clock" data-r="clock"></p>
      <ol class="wb-steps__track" aria-label="전체 단계" data-r="track"></ol>
      <details class="wb-steps__guide"><summary>단계 설명</summary><ul>${plan.map((id) => `<li><strong>${STAGE[id]}</strong> ${MEAN[id] || ""}${HEADS[id] ? `<span class="wb-steps__heads-text"> (${HEADS[id]})</span>` : ""}</li>`).join("")}</ul></details>
    </section>`;
    const el = (r) => host.querySelector(`[data-r="${r}"]`);
    const runStart = Date.now();
    let stepStart = Date.now();
    let current = -1;
    let usual = null;
    const track = () => {
      el("track").innerHTML = plan.map((id, i) => {
        const state = i < current ? "done" : i === current ? "now" : "next";
        return `<li data-step-state="${state}"${state === "now" ? ' aria-current="step"' : ""} title="${esc(MEAN[id] || "")}">
          <span class="wb-steps__mark" aria-hidden="true">${state === "done" ? "✓" : i + 1}</span><span class="wb-steps__name">${STAGE[id]}</span>
          <span class="ui-visually-hidden">${state === "done" ? "끝남" : state === "now" ? "진행 중" : "남음"}</span>
          ${HEADS[id] ? `<span class="wb-steps__heads"><span aria-hidden="true">!</span><span class="ui-visually-hidden">${HEADS[id]}</span></span>` : ""}</li>`;
      }).join("");
    };
    const setNow = (tone, label, live) => {
      el("now").innerHTML = `<span class="ui-status ui-status--${tone} ${tone === "positive" ? "wb-pop" : "wb-step-in"}"${live ? " data-live" : ""}>${label}</span>`;
    };
    const tickClock = () => {
      const a = (Date.now() - stepStart) / 1000, b = (Date.now() - runStart) / 1000;
      el("clock").textContent = `이 단계 ${clockText(a)} · 전체 ${clockText(b)}${usual ? ` · 보통 ${span(usual[0])}~${span(usual[1])} 걸려요` : ""}`;
    };
    api.every(1000, () => { if (!el("clock").hidden) tickClock(); });
    const quiet = (on) => { el("sweep").hidden = !on; el("what").hidden = !on; el("activity").hidden = !on; el("clock").hidden = !on; };
    quiet(false);
    track();
    return {
      async run(id, lines, ms) {
        current = plan.indexOf(id);
        stepStart = Date.now();
        usual = USUAL[id] || null;
        quiet(true);
        track();
        setNow("info", `<span class="wb-steps__count ui-num">${current + 1}/${plan.length}단계 · </span>${STAGE[id]}`, true);
        el("what").textContent = WHAT[id] || "";
        tickClock();
        const total = ms || 2600;
        const turn = Math.max(700, Math.floor(total / Math.max(1, lines.length)));
        for (let i = 0; i < lines.length; i += 1) {
          el("activity").innerHTML = `<span class="mk-line" data-turn>${esc(lines[i])}</span>`;
          await api.sleep(turn);
        }
        if (!lines.length) await api.sleep(total);
      },
      waitAnswer() { quiet(false); setNow("info", "답을 기다리고 있어요. 아래 질문에 답해 주세요", false); },
      finish(text) { current = plan.indexOf("approve") >= 0 ? plan.indexOf("approve") : plan.length; quiet(false); track(); setNow("positive", text || "확인을 마쳤어요. 승인을 기다려요", false); },
      complete(text) { current = plan.length; quiet(false); track(); setNow("positive", text, false); },
      stop() { quiet(false); setNow("warning", "작업이 멈췄어요", false); },
    };
  }

  /* The draft drawing of the recycle example: MIX-100 → K-100 → E-100 → TEE-100, with TEE-100 back through RCY-1. */
  const RCY_UNITS = [
    { name: "MIX-100", kind: "혼합기", x: 118, y: 74 }, { name: "K-100", kind: "압축기", x: 288, y: 74 },
    { name: "E-100", kind: "쿨러", x: 458, y: 74 }, { name: "TEE-100", kind: "분배기", x: 628, y: 74 },
    { name: "RCY-1", kind: "리사이클", x: 373, y: 190 },
  ];
  const RCY_VALUES = {
    "MIX-100": [],
    "K-100": [["출구 압력", "800 kPa", "AI 추정"], ["단열 효율", "75 %", "기본값"]],
    "E-100": [["출구 온도", "40 °C", "기본값"], ["압력 강하", "20 kPa", "기본값"]],
    "TEE-100": [["비율", "0.2 (되돌림)", "AI 추정"]],
    "RCY-1": [],
    Feed: [["온도", "30 °C", "사용자 값"], ["압력", "400 kPa", "AI 추정"], ["몰 유량", "100 kgmole/h", "기본값"]],
  };
  function pfdSvg(clickable) {
    const box = (u, i) => `<g class="pf-node" data-draw style="--i:${i}" data-unit="${u.name}"${clickable ? ` role="button" tabindex="0" aria-pressed="false" aria-label="유닛 ${u.name} (${u.kind})"` : ""}>
      <rect class="pf-box" x="${u.x}" y="${u.y}" width="124" height="48"/><text class="pf-name" x="${u.x + 10}" y="${u.y + 21}">${u.name}</text><text class="pf-kind" x="${u.x + 10}" y="${u.y + 38}">${u.kind}</text></g>`;
    const arrow = (x, y, rcy, dir) => dir === "up" ? `<path class="pf-arrow${rcy ? " pf-arrow--rcy" : ""}" d="M${x - 5} ${y + 8} L${x} ${y} L${x + 5} ${y + 8}Z"/>`
      : dir === "left" ? `<path class="pf-arrow${rcy ? " pf-arrow--rcy" : ""}" d="M${x + 8} ${y - 5} L${x} ${y} L${x + 8} ${y + 5}Z"/>`
      : `<path class="pf-arrow${rcy ? " pf-arrow--rcy" : ""}" d="M${x - 8} ${y - 5} L${x} ${y} L${x - 8} ${y + 5}Z"/>`;
    const edge = (d, end, label, lx, ly, i, rcy, dir) => `<g data-draw style="--i:${i}"><path class="pf-edge${rcy ? " pf-edge--rcy" : ""}" d="${d}"/>${arrow(end[0], end[1], rcy, dir)}<text class="pf-lbl" x="${lx}" y="${ly}">${label}</text></g>`;
    const feed = `<g data-draw style="--i:0"${clickable ? ' class="pf-node" data-unit="Feed" role="button" tabindex="0" aria-pressed="false" aria-label="스트림 Feed"' : ""}><rect class="pf-term" x="14" y="86" width="70" height="24"/><text class="pf-term-t" x="30" y="102">Feed</text></g>`;
    const product = `<g data-draw style="--i:9"><rect class="pf-term" x="796" y="86" width="84" height="24"/><text class="pf-term-t" x="808" y="102">Product</text></g>`;
    return `<svg viewBox="0 0 900 270" role="group" aria-label="초안 흐름도: Feed, MIX-100, K-100, E-100, TEE-100, Product, 그리고 TEE-100에서 RCY-1을 거쳐 MIX-100으로 돌아가는 리사이클">
      ${feed}
      ${edge("M84 98 H116", [116, 98], "Feed", 88, 90, 1, false)}
      ${box(RCY_UNITS[0], 1)}
      ${edge("M242 98 H286", [286, 98], "S1", 252, 90, 2, false)}
      ${box(RCY_UNITS[1], 3)}
      ${edge("M412 98 H456", [456, 98], "S2", 422, 90, 4, false)}
      ${box(RCY_UNITS[2], 5)}
      ${edge("M582 98 H626", [626, 98], "S3", 592, 90, 6, false)}
      ${box(RCY_UNITS[3], 7)}
      ${edge("M752 98 H794", [794, 98], "S4", 760, 90, 8, false)}
      ${product}
      ${edge("M690 122 V214 H499", [499, 214], "S5 (되돌림)", 600, 232, 10, true, "left")}
      ${box(RCY_UNITS[4], 11)}
      ${edge("M373 214 H180 V124", [180, 124], "S6", 250, 232, 12, true, "up")}
    </svg>`;
  }
  const itemCard = (name) => {
    const unit = RCY_UNITS.find((u) => u.name === name);
    const rows = RCY_VALUES[name] || [];
    return `<section class="wb-item wb-pop" aria-label="${name} 미리보기" tabindex="-1" data-item>
      <div class="wb-item__head"><strong class="wb-item__name">${name}</strong><span class="ui-tag wb-item__kind">${unit ? `유닛 · ${unit.kind}` : "물질 스트림"}</span>
      <button type="button" class="ui-btn ui-btn--sm ui-btn--quiet wb-item__close" data-act="item-close">닫기</button></div>
      ${rows.length ? `<dl class="wb-item__values">${rows.map(([k, v, src]) => `<div class="wb-item__row"><dt>${k} <span class="ui-meta wb-source">${src}</span></dt><dd class="ui-num">${v}</dd></div>`).join("")}</dl>`
        : `<p class="ui-meta">아직 정한 값이 없어요.</p>`}
      <p class="ui-meta">만들어질 내용이에요. 실제 계산 값은 케이스를 연 뒤 HYSYS에서 읽어요.</p></section>`;
  };
  const ASSUME = `<div class="wb-assume"><p class="ui-meta">가정한 조건</p><ul>
      <li>K-100 출구 압력은 맡겨 주셔서 800 kPa로 정했어요. 입구 압력 400 kPa의 두 배로, 압축기 한 대가 무리 없이 올리는 범위예요.</li>
      <li>원료는 메탄 90 %, 에탄 6 %, 프로판 4 %(몰 기준)인 천연가스로 가정했어요.
        <div class="wb-assume__source"><a href="https://en.wikipedia.org/wiki/Natural_gas" target="_blank" rel="noopener noreferrer" data-act="source">Natural gas - Wikipedia</a><span class="ui-meta"> · 발췌 확인 안 됨</span>
        <blockquote class="wb-assume__quote">Natural gas is a naturally occurring compound of gaseous hydrocarbons, primarily methane.</blockquote></div></li>
      <li>되돌리는 비율은 TEE-100 출구의 20 %로 정했어요.</li>
      <li>리사이클 계산은 허용 오차 0.01, 최대 100번 반복으로 맞춰요.</li>
      <li>물성 패키지는 답해 주신 Peng-Robinson을 써요.</li>
    </ul></div>`;
  /* The draft card ("이렇게 만들려고 해요") with its 초안 / 도면 views; the drawing paints itself in steps. */
  function draftCard(opts) {
    return `<section class="ui-panel ui-panel--flush wb-draft" aria-labelledby="mk-draft-title" data-draft>
      <div class="ui-panel__head"><h2 class="ui-panel__title" id="mk-draft-title">이렇게 만들려고 해요</h2>
        <span class="ui-status ui-status--positive" data-r="verify">복사본 계산이 수렴했어요.</span>
        <button type="button" class="ui-btn ui-btn--sm" data-act="revise">초안 고치기</button></div>
      <div class="wb-draft__body">
        <div class="ui-segmented" role="group" aria-label="도면"><button type="button" aria-pressed="true" data-act="view" data-view="draft">초안</button><button type="button" aria-pressed="false" data-act="view" data-view="sheet">도면</button></div>
        <div class="mk-pfd" data-r="pfd">
          <div class="mk-pfd__tools"><span class="mk-pfd__legend">— 물질 · <span style="color:var(--c-accent-2-ink)">- - 리사이클</span></span><span class="ui-meta">Ctrl+휠로 확대</span>

  const sheetView = () => `<div class="mk-sheet"><div class="mk-pfd__canvas">${pfdSvg(false)}</div>

  function wireDraft(api, root, onEvent) {

      alive: () => myGen === gen,
      sleep: (ms) => new Promise((resolve) => { const id = setTimeout(() => { timers.delete(id); if (myGen === gen) resolve(); }, ms); timers.add(id); }),

  /* Autoplay helpers: they press the same buttons a person would, with a visible outline on the target. */
  function makeAuto(api) {
    const visible = (el) => el && !el.closest("[hidden]") && el.getClientRects().length > 0;
    const waitFor = async (sel, opts = {}) => {
      for (let i = 0; i < 300; i += 1) {
        const el = $$(sel, api.root).find(visible);

        await api.sleep(100);
      }
      throw new Error(`autoplay: ${sel} not found`);
    };

      el.scrollIntoView({ block: "nearest", behavior: reduced() ? "auto" : "smooth" });
      el.classList.add("tut-poke");
      await api.sleep(reduced() ? 250 : 650);
      el.classList.remove("tut-poke");
    };
    return {
      async click(sel) { const el = await waitFor(sel, { enabled: true }); await poke(el); el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true })); await api.sleep(300); },
      async type(sel, text) {
        const el = await waitFor(sel, { enabled: true }); await poke(el); el.focus();
        if (reduced()) { el.value = text; el.dispatchEvent(new Event("input", { bubbles: true })); }

      async select(sel, value) { const el = await waitFor(sel, { enabled: true }); await poke(el); el.value = value; el.dispatchEvent(new Event("change", { bubbles: true })); await api.sleep(300); },
      async check(sel) { const el = await waitFor(sel, { enabled: true }); await poke(el); if (!el.checked) el.click(); await api.sleep(250); },
      async look(sel) { const el = await waitFor(sel); el.scrollIntoView({ block: "center", behavior: reduced() ? "auto" : "smooth" }); await api.sleep(2200); },

    {

      },
      doneSay: "끝났어요. 수고하셨어요. 처음부터 다시 하려면 '처음부터 다시'를 누르세요.",

  ];

  /* ---------------- Guide: the one thing to press now ----------------
     For the first unchecked "이렇게 해 보세요" item, a ring sits on its control inside the practice screen, the rest of the

     real control underneath (the layer ignores the pointer). */
  const WAIT = { sel: ".wb-cr__progress, [data-newcase=steps]", kind: "watch", say: "진행 중이에요. 잠시 기다려요" };
  const firstOf = (...sels) => (root) => sels.map((s) => $$(s, root).find((el) => !el.closest("[hidden]") && el.getClientRects().length)).find(Boolean) || null;
  const GUIDE = {
    welcome: { start: { sel: "[data-act=start]" } },
    connect: { launch: { sel: "[data-r=launch] [data-act=launch]" }, linked: { sel: "[data-r=status]", kind: "watch", say: "여기에 PID가 뜰 때까지 기다려요" } },
    "own-hysys": {
      save: { sel: "[data-act=save]" }, close: { sel: "[data-act=close]" }, probe: { sel: "[data-act=probe]" }, launch: { sel: "[data-act=launch]" },

    },
    model: { nav: { sel: "[data-nav=settings]" }, provider: { sel: "[data-r=provider]", kind: "select", say: "여기서 OpenAI를 골라요" }, model: { sel: "[data-r=model]", kind: "select", say: "여기서 모델을 골라요" } },
    words: { nav: { sel: "[data-nav=new]" }, entry: { sel: "[data-entry=words]" }, typed: { sel: "[data-r=words]", kind: "type", example: REQUEST }, start: { sel: "[data-act=start]" } },
    answer: {
      pkg: { sel: "[data-r=pkg]", kind: "select", say: "여기서 Peng-Robinson을 골라요" }, offer: { sel: "[data-act=offer]" },
      auto: { sel: "[data-r=k100]", kind: "type", example: "알아서 해줘" }, submit: { sel: "[data-act=submit]" },
    },
    draft: {
      watch: { sel: "[data-newcase=steps]", kind: "watch", say: "'확인을 마쳤어요'가 뜰 때까지 지켜봐요" },
      pick: { sel: ".pf-node[data-unit='K-100']", say: "K-100을 눌러요" }, sheet: { sel: "[data-act=view][data-view=sheet]" }, png: { sel: "[data-act=export][data-kind=PNG]" },
    },
    approve: {
      read: { sel: ".wb-assume", kind: "read", say: "가정한 조건을 읽어요" },
      checks: (root) => ({ sel: $("[data-r=c1]", root) && !$("[data-r=c1]", root).checked ? "[data-r=c1]" : "[data-r=c2]", kind: "check" }),
      approve: { sel: "[data-act=approve]" }, opened: { sel: "[data-newcase=steps]", kind: "watch", say: "케이스가 열릴 때까지 기다려요" },
    },
    template: { entry: { sel: "[data-entry=template]" }, kind: { sel: "[data-r=kind]", kind: "select", say: "여기서 증류탑을 골라요" }, value: { sel: "[data-r=p2]", kind: "type", example: "2", say: "환류비를 바꿔 적어요" }, start: { sel: "[data-act=start]" } },
    image: { entry: { sel: "[data-entry=image]" }, pick: { sel: "[data-act=demo][data-i='1']", say: "이 데모 그림을 눌러요" }, use: { sel: "[data-act=use]" }, start: { sel: "[data-act=start]" } },
    agent: {
      open: { sel: "[data-act=agent]" },
      send: (root) => (($("[data-r=ask]", root) || {}).value || "").trim() ? { sel: "[data-act=send]" } : { sel: "[data-r=ask]", kind: "type", example: "Feed 압력 좀 올려줄래?" },
      trial: { sel: "[data-act=trial]" }, apply: { sel: "[data-act=apply]" },
    },
    stuck: {
      lost: { sel: "[data-act=resume][data-k=lost]" },
      stopped: (root) => ($("[data-act=resume][data-k=stopped]", root) ? { sel: "[data-act=resume][data-k=stopped]" } : { sel: "[data-tab=stopped]", say: "이 탭을 눌러요" }),
      unconv: (root) => ($("[data-act=repair]", root) ? { sel: "[data-act=repair]" } : { sel: "[data-tab=unconv]", say: "이 탭을 눌러요" }),
      model: { sel: "[data-tab=model]", say: "이 탭을 눌러요" },
    },
    report: { nav: { sel: "[data-nav=settings]" }, save: { sel: "[data-act=save]" }, saved: { sel: "[data-act=confirm]", say: "여기서 '저장'을 눌러요" } },
    finish: { recap: { sel: "[data-act=ok]" } },
  };
  const VERB = { click: "여기를 눌러요", type: "여기에 적어요", select: "여기서 골라요", check: "여기에 체크해요", watch: "여기를 지켜봐요", read: "여기를 읽어요" };
  const GUIDE_KEY = "hc-tutorial-guide";
  const guideBtn = $("#tut-guide");
  const layer = $("#tut-guide-layer"), ring = $("#tut-guide-ring"), bubble = $("#tut-bubble");
  const G = { on: true, key: null, el: null, spec: null, since: 0, nudged: false, lastAct: Date.now(), lastInput: "pointer", firstAt: 0, sel: null };
  try { G.on = localStorage.getItem(GUIDE_KEY) !== "off"; } catch (e) { /* storage blocked: the guide stays on */ }
  const paintToggle = () => { guideBtn.textContent = G.on ? "안내 끄기" : "안내 켜기"; guideBtn.setAttribute("aria-describedby", "tut-guide-note"); $("#tut-guide-note").textContent = G.on ? "지금 누를 곳을 표시하고 있어요" : "안내를 껐어요"; };
  guideBtn.addEventListener("click", () => {
    G.on = !G.on;
    try { localStorage.setItem(GUIDE_KEY, G.on ? "on" : "off"); } catch (e) { /* kept for this visit only */ }
    paintToggle();
    G.key = null; G.el = null;
    guideTick();
  });
  paintToggle();

  const visibleEl = (el) => el && !el.closest("[hidden]") && el.getClientRects().length > 0;
  function resolve() {
    const { api, step } = STEPS.current || {};
    if (!api || !api.root || done.has(step.id) && step.todo.every(([k]) => api.isChecked(k))) return null;
    const next = step.todo.find(([k]) => !api.isChecked(k));
    if (!next) return null;
    let spec = (GUIDE[step.id] || {})[next[0]];
    if (typeof spec === "function") spec = spec(api.root);
    if (!spec) return null;
    let el = $$(spec.sel, api.root).find(visibleEl);
    if (!el) { spec = WAIT; el = $$(WAIT.sel, api.root).find(visibleEl); }
    if (!el) return null;
    return { key: next[0], text: next[1].replace(/<[^>]+>/g, ""), spec, el };
  }
  const topBarBottom = () => $(".tut-top").getBoundingClientRect().bottom;
  function inView(r) { return r.top >= topBarBottom() + 8 && r.bottom <= innerHeight - 8; }

  function hide() { layer.hidden = true; bubble.hidden = true; G.key = null; G.el = null; }
  function place(travel) {
    const t = G.el.getBoundingClientRect();
    const m = STEPS.current.api.root.getBoundingClientRect();
    const vw = document.documentElement.clientWidth, vh = innerHeight;
    layer.style.left = `${m.left}px`; layer.style.top = `${m.top}px`; layer.style.width = `${m.width}px`; layer.style.height = `${m.height}px`;
    const pad = 5;
    ring.classList.toggle("is-travel", !!travel && !reduced());
    ring.style.transform = `translate(${Math.round(t.left - m.left - pad)}px, ${Math.round(t.top - m.top - pad)}px)`;
    ring.style.width = `${Math.round(t.width + pad * 2)}px`; ring.style.height = `${Math.round(t.height + pad * 2)}px`;
    const w = bubble.offsetWidth, h = bubble.offsetHeight, gap = 14, top = topBarBottom() + 8;
    const below = t.bottom + gap + h <= vh - 8, above = t.top - gap - h >= top;
    const side = below ? "below" : above ? "above" : vh - t.bottom >= t.top - top ? "below" : "above";
    let y = side === "below" ? t.bottom + gap : t.top - gap - h;
    y = Math.max(top, Math.min(vh - 8 - h, y));
    const x = Math.max(12, Math.min(vw - 12 - w, t.left + t.width / 2 - w / 2));
    bubble.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
    bubble.setAttribute("data-side", side);
    bubble.style.setProperty("--arrow-x", `${Math.round(Math.max(16, Math.min(w - 16, t.left + t.width / 2 - x)))}px`);
  }
  function fillBubble(found) {
    const kind = found.spec.kind || "click";
    $(".tut-bubble__verb", bubble).textContent = found.spec.say || VERB[kind];
    $(".tut-bubble__text", bubble).textContent = found.spec === WAIT ? "끝나면 다음 안내로 넘어가요." : found.text;
    const ex = $(".tut-bubble__example", bubble);
    ex.hidden = !found.spec.example;
    if (found.spec.example) { ex.querySelector("q").textContent = found.spec.example; }
    bubble.setAttribute("data-kind", kind);
  }
  function guideTick(scrollOnly) {
    if (!G.on) { hide(); return; }
    if (scrollOnly && G.el) { place(false); return; }
    const found = resolve();
    if (!found) { hide(); return; }
    const changed = found.el !== G.el || found.key !== G.key || found.spec.sel !== G.sel;
    if (changed) {
      const travel = G.el !== null && !layer.hidden;
      G.key = found.key; G.el = found.el; G.spec = found.spec; G.sel = found.spec.sel; G.since = Date.now(); G.nudged = false;
      layer.hidden = false; bubble.hidden = false;
      fillBubble(found);
      ring.classList.remove("is-nudge");
      const wait = Math.max(0, G.firstAt - Date.now());
      const focusIt = G.lastInput === "key" && found.spec.kind !== "watch" && found.spec.kind !== "read" && found.spec !== WAIT;
      const el = found.el;
      setTimeout(() => {
        if (G.el !== el) return;
        const r = el.getBoundingClientRect();
        if (!inView(r)) el.scrollIntoView({ block: "center", inline: "nearest", behavior: reduced() ? "auto" : "smooth" });
        else el.scrollIntoView({ block: "nearest", inline: "nearest", behavior: reduced() ? "auto" : "smooth" });
        if (focusIt && typeof el.focus === "function") el.focus({ preventScroll: true });
      }, wait);
      place(travel);
      return;
    }
    place(false);
    if (!G.nudged && Date.now() - Math.max(G.since, G.lastAct) > 6000 && !reduced()) {
      G.nudged = true;
      ring.classList.remove("is-nudge"); void ring.offsetWidth; ring.classList.add("is-nudge");
    }
  }
  setInterval(() => guideTick(false), 160);
  afterCheck = () => guideTick(false);
  let rafPending = false;
  const onMove = () => { if (rafPending) return; rafPending = true; requestAnimationFrame(() => { rafPending = false; guideTick(true); }); };
  window.addEventListener("scroll", onMove, { passive: true, capture: true });
  window.addEventListener("resize", onMove);
  document.addEventListener("keydown", () => { G.lastInput = "key"; G.lastAct = Date.now(); }, true);
  document.addEventListener("input", () => { G.lastAct = Date.now(); }, true);
  document.addEventListener("pointerdown", (e) => {
    G.lastInput = "pointer"; G.lastAct = Date.now();
    if (!G.on || !G.el || layer.hidden || bubble.contains(e.target)) return;
    const root = STEPS.current && STEPS.current.api.root;
    if (!root || !root.contains(e.target) || G.el.contains(e.target) || (G.spec && G.spec.kind === "watch")) return;
    $(".tut-bubble__verb", bubble).textContent = `여기예요. ${(G.spec && G.spec.say) || VERB[(G.spec && G.spec.kind) || "click"]}`;
    if (!reduced()) { bubble.classList.remove("is-shake"); void bubble.offsetWidth; bubble.classList.add("is-shake"); }
  }, true);
  $(".tut-bubble__example button", bubble).addEventListener("click", () => {
    if (!G.el || !G.spec || !G.spec.example) return;
    G.el.value = G.spec.example;
    G.el.dispatchEvent(new Event("input", { bubbles: true }));
    G.el.focus({ preventScroll: true });
  });
  /* A new step shows its heading first; the guide scrolls to the first target a moment later. */
  const goPlain = go;
  go = function (index, focus) { G.firstAt = Date.now() + 900; hide(); goPlain(index, focus); guideTick(false); };
  const guideState = () => {
    const r = (el) => { if (!el) return null; const b = el.getBoundingClientRect(); return { left: b.left, top: b.top, right: b.right, bottom: b.bottom, width: b.width, height: b.height }; };
    return { on: G.on, visible: !layer.hidden && !bubble.hidden, key: G.key, sel: G.sel, wait: G.spec === WAIT, ring: layer.hidden ? null : r(ring), target: r(G.el), bubble: bubble.hidden ? null : r(bubble), vw: document.documentElement.clientWidth, vh: innerHeight };
  };

  /* Start where the address points (#step-id), else at the first step not done yet. */
  const fromHash = STEPS.findIndex((s) => `#${s.id}` === location.hash);
  const firstOpen = STEPS.findIndex((s) => !done.has(s.id));
  go(fromHash >= 0 ? fromHash : firstOpen >= 0 ? firstOpen : 0, false);
  window.addEventListener("hashchange", () => { const i = STEPS.findIndex((s) => `#${s.id}` === location.hash); if (i >= 0 && i !== cur) go(i, true); });
  window.__tutorial = { steps: STEPS.map((s) => s.id), go: (i) => go(i, false), current: () => cur, isDone: (id) => done.has(id), guide: guideState };
})();
