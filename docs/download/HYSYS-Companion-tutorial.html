.ui-stat__label { font-family: var(--font-meta); text-transform: var(--meta-case); letter-spacing: var(--track-label); font-size: var(--fs-md); color: var(--c-ink-2); line-height: 1.4; }

.ui-stat__value small { display: inline-block; white-space: nowrap; font-size: var(--fs-lg); font-weight: var(--fw-medium); color: var(--c-ink-3); letter-spacing: 0; }

.ui-stat-row > .ui-stat { background: var(--c-surface); border: var(--bw-surface) solid var(--c-frame); border-radius: var(--radius-md); padding: var(--sp-20) var(--sp-24); box-shadow: var(--shadow-raised); }

/* ---------- Table ---------- */

.ui-table thead th { position: sticky; top: 0; z-index: 1; background: var(--c-sunken); color: var(--c-ink-2); font-family: var(--font-meta); text-transform: var(--meta-case); letter-spacing: var(--track-label); font-weight: var(--fw-medium); font-size: var(--fs-sm); white-space: nowrap; }

th[aria-sort="descending"] .ui-sort::after { opacity: 1; }
th[aria-sort] .ui-sort { color: var(--c-ink); }
@media (max-width: 768px) { .ui-sort { min-height: 44px; } }
@media (max-width: 640px) {
  .ui-table--stack, .ui-table--stack thead, .ui-table--stack tbody, .ui-table--stack tr, .ui-table--stack td { display: block; width: 100%; }
  .ui-table--stack thead { position: static; }
  .ui-table--stack thead tr { display: flex; flex-wrap: wrap; gap: var(--sp-8); padding: var(--sp-8) var(--sp-16); background: var(--c-sunken); }

}

/* ---------- Lists ---------- */
.ui-list { display: grid; }

.ui-steps > li { counter-increment: step; display: grid; gap: var(--sp-8); align-content: start; padding-top: var(--sp-16); border-top: 2px solid var(--c-ink); }
.ui-steps > li::before { content: counter(step); font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--c-accent-ink); }
@media (max-width: 860px) { .ui-steps { grid-template-columns: minmax(0, 1fr); gap: var(--sp-24); } }
.ui-checklist > li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: var(--sp-12); padding-block: var(--sp-4); }
.ui-checklist > li::before { content: ""; width: 10px; height: 6px; margin: 0.5em 0 0 3px; border-left: 2px solid var(--c-accent); border-bottom: 2px solid var(--c-accent); transform: rotate(-45deg); }

/* ---------- Disclosure, tabs, dialog ---------- */
.ui-disclosure { border-bottom: 1px solid var(--c-line); }
.ui-disclosure:first-of-type { border-top: 1px solid var(--c-line); }
.ui-disclosure > summary { margin-block: var(--sp-4); display: flex; justify-content: space-between; align-items: center; gap: var(--sp-16); min-height: 56px; padding-block: var(--sp-12); cursor: pointer; list-style: none; font-weight: var(--fw-strong); font-size: var(--fs-lg); line-height: 1.35; }
.ui-disclosure > summary::-webkit-details-marker { display: none; }
.ui-disclosure > summary::after { content: ""; flex: none; width: 10px; height: 10px; margin-right: 4px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-3px) rotate(45deg); transition: transform var(--dur-ui) var(--ease); }
.ui-disclosure[open] > summary::after { transform: translateY(2px) rotate(-135deg); }
.ui-disclosure > :not(summary) { padding-bottom: var(--sp-20); color: var(--c-ink-2); max-width: 68ch; }
.ui-tabs { display: flex; gap: var(--sp-4); border-bottom: 1px solid var(--c-line); overflow-x: auto; }
.ui-tabs [role="tab"] { min-height: 44px; padding: 0 var(--sp-12); border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--c-ink-2); font-weight: var(--fw-medium); cursor: pointer; white-space: nowrap; }
.ui-tabs [role="tab"][aria-selected="true"] { color: var(--c-ink); border-bottom-color: var(--c-accent); }
.ui-dialog { width: min(480px, calc(100vw - 32px)); padding: 0; border: var(--bw-surface) solid var(--c-frame); border-radius: var(--radius-lg); background: var(--c-surface); color: var(--c-ink); box-shadow: var(--shadow-overlay); }
.ui-dialog::backdrop { background: var(--c-ink); opacity: 0.45; }
.ui-dialog__body { display: grid; gap: var(--sp-16); padding: var(--sp-24); }
.ui-dialog__actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--sp-12); padding: var(--sp-16) var(--sp-24); border-top: 1px solid var(--c-line); background: var(--c-sunken); }
.ui-toast-region { position: fixed; z-index: 40; right: var(--sp-16); bottom: var(--sp-16); display: grid; gap: var(--sp-8); max-width: min(400px, calc(100vw - 32px)); }
.ui-toast { display: flex; gap: var(--sp-12); align-items: flex-start; padding: var(--sp-12) var(--sp-16); border-radius: var(--radius-md); background: var(--c-ink); color: var(--c-canvas); box-shadow: var(--shadow-overlay); font-size: var(--fs-md); }

/* ---------- Site chrome (read-once pages) ---------- */
.ui-sitebar { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--c-canvas) 94%, transparent); border-bottom: var(--bw-rule) solid var(--c-frame); }
.ui-sitebar__inner { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-24); min-height: 64px; }
.ui-brand { white-space: nowrap; display: inline-flex; align-items: center; gap: var(--sp-8); color: var(--c-ink); font-weight: var(--fw-display); font-size: var(--fs-lg); letter-spacing: calc(var(--track-display) * 0.4); text-decoration: none; min-height: 44px; }
.ui-brand svg { width: 20px; height: 20px; }
.ui-sitenav { display: flex; align-items: center; gap: var(--sp-8); }
.ui-sitenav a:not(.ui-btn) { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--sp-12); color: var(--c-ink-2); font-weight: var(--fw-medium); text-decoration: none; border-radius: var(--radius-sm); }
.ui-sitenav a:not(.ui-btn):hover { color: var(--c-ink); background: var(--c-sunken); }
.ui-menu { display: none; }
@media (max-width: 860px) {
  .ui-sitenav { display: none; }
  .ui-menu { display: block; position: relative; }
  .ui-menu > summary { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 0 var(--sp-12); border: var(--bw-control) solid var(--control-edge, var(--c-control)); border-radius: var(--radius-sm); cursor: pointer; list-style: none; font-weight: var(--fw-medium); }
  .ui-menu > summary::-webkit-details-marker { display: none; }
  .ui-menu__panel { position: absolute; right: 0; top: calc(100% + var(--sp-8)); display: grid; min-width: 220px; padding: var(--sp-8); background: var(--c-surface); border: var(--bw-surface) solid var(--c-frame); border-radius: var(--radius-md); box-shadow: var(--shadow-overlay); }
  .ui-menu__panel a:not(.ui-btn) { display: flex; align-items: center; min-height: 44px; padding: 0 var(--sp-12); color: var(--c-ink); text-decoration: none; border-radius: var(--radius-sm); }
  .ui-menu__panel .ui-btn { margin-top: var(--sp-8); }
}
.ui-hero { padding-block: var(--hero-pad); }
.ui-hero__copy { display: grid; gap: var(--sp-24); align-content: start; min-width: 0; }
.ui-hero__art { display: grid; place-items: center; min-width: 0; }
/* The stage hero gives the signature moment the larger column and the height to be bold in. */
.ui-hero--stage .ui-split { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: stretch; }
.ui-hero--stage .ui-hero__art { min-height: min(560px, 64vh); align-items: center; justify-items: stretch; }
@media (max-width: 960px) { .ui-hero--stage .ui-split { grid-template-columns: minmax(0, 1fr); } .ui-hero--stage .ui-hero__art { min-height: 0; } }
.ui-quote { display: grid; gap: var(--sp-24); max-width: 52ch; }
.ui-quote blockquote { font-family: var(--font-display); font-weight: var(--fw-medium); font-size: var(--fs-2xl); line-height: 1.4; letter-spacing: -0.01em; text-wrap: pretty; }
.ui-quote figcaption { display: grid; gap: 2px; font-size: var(--fs-md); color: var(--c-ink-2); }
.ui-quote figcaption strong { color: var(--c-ink); font-weight: var(--fw-strong); }
.ui-plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-16); align-items: stretch; }
.ui-plan { display: flex; flex-direction: column; gap: var(--sp-20); padding: var(--sp-32) var(--sp-24); background: var(--c-surface); border: var(--bw-surface) solid var(--c-frame); border-radius: var(--radius-md); box-shadow: var(--shadow-raised); }
.ui-plan--featured { border-color: var(--c-ink); box-shadow: inset 0 0 0 1px var(--c-ink); }
.ui-plan__price { font-family: var(--font-heading); font-weight: var(--fw-display); font-size: var(--fs-4xl); line-height: 1.15; letter-spacing: calc(var(--track-display) * 0.5); font-variant-numeric: tabular-nums; }
.ui-plan__price small { font-family: var(--font-text); font-size: var(--fs-md); font-weight: var(--fw-text); color: var(--c-ink-3); letter-spacing: 0; }
.ui-plan .ui-btn { margin-top: auto; }
@media (max-width: 960px) { .ui-plans { grid-template-columns: minmax(0, 1fr); max-width: 520px; } }
.ui-cta-band { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-24); }
.ui-footer { padding-block: var(--sp-48); background: var(--c-ink); color: var(--c-canvas); }
.ui-footer a { color: inherit; }
.ui-footer .ui-meta { color: var(--c-canvas); opacity: 0.75; }
.ui-pixel { image-rendering: pixelated; shape-rendering: crispEdges; max-width: 100%; height: auto; }

/* ---------- App chrome (work surfaces) ---------- */
.ui-app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.ui-app__nav { position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: var(--sp-24); padding: var(--sp-20) var(--sp-16); border-right: var(--bw-rule) solid var(--c-frame); background: var(--c-surface); }
.ui-app__main { min-width: 0; display: flex; flex-direction: column; }
.ui-navlist { display: grid; gap: var(--sp-4); }
.ui-navlist a, .ui-navlist button { transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-press) var(--ease-out); display: flex; align-items: center; gap: var(--sp-12); min-height: 40px; padding: 0 var(--sp-12); border: 0; border-radius: var(--radius-sm); background: none; color: var(--c-ink-2); font-weight: var(--fw-medium); font-size: var(--fs-md); text-decoration: none; text-align: left; cursor: pointer; }
.ui-navlist a:hover, .ui-navlist button:hover { background: var(--c-sunken); color: var(--c-ink); }
.ui-navlist [aria-current="page"], .ui-navlist [aria-current="true"] { background: var(--c-sunken); color: var(--c-ink); box-shadow: inset 2px 0 0 var(--c-accent); }
.ui-navlist svg { width: 18px; height: 18px; flex: none; }
.ui-navgroup { display: grid; gap: var(--sp-8); }
.ui-navgroup__label { padding: 0 var(--sp-12); font-family: var(--font-meta); text-transform: var(--meta-case); letter-spacing: var(--track-label); font-size: var(--fs-xs); color: var(--c-ink-3); font-weight: var(--fw-medium); }
.ui-topbar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-12) var(--sp-24); min-height: 64px; padding: var(--sp-12) var(--work-gutter); background: color-mix(in srgb, var(--c-canvas) 94%, transparent); border-bottom: var(--bw-rule) solid var(--c-frame); }
.ui-page { display: grid; gap: var(--sp-24); padding: var(--sp-24) var(--work-gutter) var(--sp-48); }
.ui-container > .ui-page { padding-inline: 0; }
.ui-page__head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--sp-16); }
.ui-page__title { font-family: var(--font-display); font-weight: var(--fw-display); font-size: var(--fs-2xl); line-height: 1.2; letter-spacing: calc(var(--track-display) * 0.4); text-transform: var(--display-case); }
.ui-workgrid { display: grid; gap: var(--sp-16); grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: start; }
.ui-span-12 { grid-column: span 12; } .ui-span-8 { grid-column: span 8; } .ui-span-7 { grid-column: span 7; }
.ui-span-6 { grid-column: span 6; } .ui-span-5 { grid-column: span 5; } .ui-span-4 { grid-column: span 4; } .ui-span-3 { grid-column: span 3; }
.ui-scroll { max-height: var(--scroll-max, 420px); overflow-y: auto; overscroll-behavior: contain; }
.ui-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-12); }
.ui-panel__head > .ui-toolbar { flex: 1 1 360px; justify-content: flex-end; }
.ui-search { position: relative; flex: 1 1 220px; max-width: 320px; }
.ui-empty { display: grid; justify-items: center; gap: var(--sp-8); padding: var(--sp-48) var(--sp-24); text-align: center; color: var(--c-ink-2); }
@media (max-width: 1100px) {
  .ui-span-8, .ui-span-7, .ui-span-6, .ui-span-5, .ui-span-4 { grid-column: span 12; }
  .ui-span-3 { grid-column: span 6; }
}
@media (max-width: 860px) {
  .ui-app { grid-template-columns: minmax(0, 1fr); }
  .ui-app__nav { position: static; height: auto; flex-direction: row; align-items: center; gap: var(--sp-12); padding: var(--sp-8) var(--work-gutter); border-right: 0; border-bottom: var(--bw-rule) solid var(--c-frame); overflow-x: auto; }
  .ui-app__nav .ui-navgroup__label { display: none; }
  .ui-navlist { display: flex; gap: var(--sp-8); }
  .ui-navlist a, .ui-navlist button { min-height: 44px; white-space: nowrap; }
  .ui-navlist [aria-current="page"], .ui-navlist [aria-current="true"] { box-shadow: inset 0 -2px 0 var(--c-accent); }
  .ui-topbar { position: static; }
  .ui-search { max-width: none; }
}
@media (max-width: 640px) { .ui-span-3 { grid-column: span 12; } }

/* ---------- Settings (guided forms) ---------- */
.ui-settings { display: grid; grid-template-columns: 220px minmax(0, 720px); gap: var(--sp-48); align-items: start; }
.ui-settings__nav { position: sticky; top: 88px; }
.ui-settings__body { display: grid; gap: var(--sp-32); min-width: 0; }
.ui-setting-section { display: grid; gap: var(--sp-20); scroll-margin-top: 88px; }
.ui-setting-section__head { display: grid; gap: var(--sp-4); }
.ui-setting-section--danger { border-color: var(--c-negative); }
.ui-savebar { position: static; bottom: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-12); padding: var(--sp-12) var(--sp-16); background: var(--c-surface); border: var(--bw-surface) solid var(--c-frame); border-radius: var(--radius-md); box-shadow: var(--shadow-overlay); }
@media (min-width: 1024px) and (min-height: 700px) { .ui-savebar { position: sticky; } }
@media (max-width: 860px) {
  .ui-settings { grid-template-columns: minmax(0, 1fr); gap: var(--sp-24); }
  .ui-settings__nav { position: static; }
  .ui-settings__nav .ui-navlist { display: flex; overflow-x: auto; }
}

/* ---------- Signature parts ----------
   Token-only like everything else, so they render in any style; house-styles.md section 5 says which
   style leans on which (instrument parts for computational-brutalism, blocks and the sticker for
   neo-brutalism). Brackets and crosses are decoration: their alt text is empty. */
.ui-coord { font-family: var(--font-mono); font-size: var(--fs-xs); line-height: 1.4; letter-spacing: 0.06em; text-transform: uppercase; color: var(--on-head, var(--c-ink-3)); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ui-coord::before { content: "[ " / ""; }
.ui-coord::after { content: " ]" / ""; }
.ui-prompt::before { content: "> " / ""; font-family: var(--font-mono); color: var(--c-accent-ink); }
.ui-prompt--cursor::after { content: "" / ""; display: inline-block; width: 0.6em; height: 1.1em; margin-left: 0.2em; vertical-align: text-bottom; background: var(--c-accent); }
.ui-ruler { height: 12px; border-bottom: 1px solid var(--c-line-strong); background-image: linear-gradient(90deg, var(--c-ink-3) 1px, transparent 1px), linear-gradient(90deg, var(--c-line-strong) 1px, transparent 1px); background-size: 40px 12px, 8px 6px; background-position: left top, left bottom; background-repeat: repeat-x; }
.ui-frame { position: relative; padding: var(--panel-pad, var(--sp-24)); background: var(--c-surface); border: var(--bw-surface) solid var(--c-frame); min-width: 0; }
.ui-frame::before, .ui-frame::after { content: "+" / ""; position: absolute; font-family: var(--font-mono); font-size: var(--fs-lg); line-height: 1; color: var(--c-accent-ink); }
.ui-frame::before { top: -0.6em; left: -0.32em; }
.ui-frame::after { bottom: -0.6em; right: -0.32em; }
.ui-scan { background-image: repeating-linear-gradient(0deg, transparent 0 2px, var(--c-line) 2px 3px); }
.ui-readout { min-width: 0; display: grid; gap: var(--sp-4); padding: var(--sp-12) var(--sp-16); background-color: var(--c-sunken); color: var(--c-ink); border: var(--bw-control) solid var(--c-frame); border-radius: var(--radius-xs); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ui-panel--accent { background: var(--c-accent-wash); }
.ui-panel--support { background: var(--c-support); color: var(--c-support-ink); }
.ui-panel--accent-2 { background: var(--c-accent-2-wash); }
/* Rich layers: a full-bleed colour band between sections, a two-accent wash and the lock's glow
   token (none on a calm, flat or offset lock). Text inside a band takes the band's own ink. */
.ui-band { background: var(--c-accent); color: var(--c-on-accent); }
.ui-band--accent-2 { background: var(--c-accent-2); color: var(--c-on-accent-2); }
.ui-band--support { background: var(--c-support); color: var(--c-support-ink); }
.ui-band :where(h1, h2, h3, h4, p, li, dt, dd, small, blockquote, figcaption, cite, .ui-meta) { color: inherit; }
.ui-band .ui-quote figcaption, .ui-band .ui-quote figcaption strong { color: inherit; }
:is(.ui-section, .ui-band) + .ui-band, .ui-band + .ui-section { border-top: 0; }
.ui-wash { background-image: linear-gradient(135deg, var(--c-accent-wash), var(--c-accent-2-wash)); }
.ui-glow { box-shadow: var(--glow); }
/* Section marks: a data-coord label (sheet, grid reference, revision) sitting on the section rule.
   Only a lock with section_marks "coord" shows it. */
:is(.ui-section, .ui-hero)[data-coord] { position: relative; }
:is(.ui-section, .ui-hero)[data-coord]::before { content: attr(data-coord) / ""; display: var(--section-marks); position: absolute; top: calc(var(--bw-rule) * -1); left: max(var(--gutter), calc((100% - var(--container, 1200px)) / 2 + var(--gutter))); padding: 2px var(--sp-8); background: var(--c-ink); color: var(--c-canvas); font-family: var(--font-mono); font-size: var(--fs-xs); line-height: 1.4; letter-spacing: var(--track-label); text-transform: uppercase; }
/* Moment type: the one place a page may go past the display range, up to the lock's moment ceiling
   (DS-004 accepts it only inside [data-ui-moment]). */
.ui-setpiece { font-family: var(--font-display); font-weight: var(--fw-display); font-size: var(--fs-moment); line-height: 0.92; letter-spacing: var(--track-display); text-transform: var(--display-case); text-wrap: balance; overflow-wrap: break-word; }
:lang(ko) .ui-setpiece, .ui-setpiece:lang(ko) { line-height: var(--lh-display-ko); letter-spacing: calc(var(--track-display) / 2); }
.ui-bignum { font-family: var(--font-heading); font-weight: var(--fw-display); font-size: var(--fs-moment); line-height: 0.9; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.ui-sticker { display: inline-flex; align-items: center; gap: var(--sp-8); padding: var(--sp-4) var(--sp-12); background: var(--c-accent); color: var(--c-on-accent); border: var(--bw-control) solid var(--control-edge, var(--c-accent)); border-radius: var(--radius-sm); box-shadow: var(--shadow-control); font-weight: var(--fw-strong); font-size: var(--fs-md); line-height: 1.3; transform: rotate(-2deg); }

/* ---------- Charts (kit/ui.js draws them) ---------- */
.ui-chart { display: grid; gap: var(--sp-12); min-width: 0; }
.ui-chart svg { width: 100%; height: auto; overflow: visible; }
.ui-chart .ui-axis text { fill: var(--c-ink-3); font-size: 12px; font-family: var(--font-meta); font-variant-numeric: tabular-nums; }
.ui-chart .ui-grid-line { stroke: var(--c-line); stroke-width: 1; }
.ui-chart .ui-baseline { stroke: var(--c-line-strong); stroke-width: 1; }
.ui-chart .ui-marker { stroke: var(--c-ink-2); stroke-width: 1; stroke-dasharray: 3 3; }
.ui-chart .ui-marker-label { fill: var(--c-ink-2); font-size: 12px; font-family: var(--font-text); }
.ui-legend { display: flex; flex-wrap: wrap; gap: var(--sp-8) var(--sp-16); font-family: var(--font-meta); text-transform: var(--meta-case); font-size: var(--fs-sm); color: var(--c-ink-2); }
.ui-legend span { display: inline-flex; align-items: center; gap: var(--sp-8); }
.ui-legend i { width: 10px; height: 10px; border-radius: var(--radius-xs); background: var(--swatch); }
.ui-chart table { font-size: var(--fs-sm); }
.ui-chart details > summary { display: inline-flex; align-items: center; min-height: 44px; cursor: pointer; }

/* ---------- Motion ---------- */
/* Press feedback: rows, chips and tabs sink 1px and shrink a little within --dur-press. Hover and focus change at once. */
.ui-segmented button:active, .ui-navlist a:active, .ui-navlist button:active, .wb-hist__item:active, .wb-entry:active { transform: var(--press); }
.ui-btn[aria-busy="true"] { cursor: progress; }
.ui-btn[aria-busy="true"]::after { content: ""; flex: none; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: wb-spin calc(var(--dur-enter) * 5) var(--ease-linear) infinite; }
@keyframes wb-spin { to { transform: rotate(360deg); } }

.ui-reveal { animation: ui-enter var(--dur-enter) var(--ease-out) backwards; }
@keyframes ui-enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
/* A list that enters item by item: motion.ts gives each row its own --stagger (20 ms apart, 120 ms at most). */
.wb-stagger > * { animation: ui-enter var(--dur-enter) var(--ease-out) backwards; animation-delay: var(--stagger, 0ms); }
/* A new screen fades in and slides 4px; the old one is already gone, so a quick second click just starts the next one. */
.wb-screen { animation: ui-enter var(--dur-enter) var(--ease-out) backwards; }

/* A state that just changed pops in with a small overshoot, so the eye lands on it: a new step, a status, a count. */
.wb-pop { animation: ui-pop var(--dur-pop) var(--ease-spring) backwards; }
@keyframes ui-pop { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
/* The next step of a running job slides in from the left, where the finished steps went. */
.wb-step-in { animation: ui-step-in var(--dur-ui) var(--ease-out) backwards; }
@keyframes ui-step-in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
/* A row whose result just arrived washes once in its status colour, then settles. */
.wb-flash { animation: ui-flash calc(var(--dur-enter) * 5) var(--ease) backwards; }
.wb-flash--positive { --flash: var(--c-positive-wash); }
.wb-flash--negative { --flash: var(--c-negative-wash); }
.wb-flash--info { --flash: var(--c-info-wash); }
@keyframes ui-flash { from { background-color: var(--flash, var(--c-info-wash)); } to { background-color: transparent; } }
/* Something is working right now: its status dot beats. Finished states keep a still dot. */
.ui-status[data-live]::before { animation: ui-beat calc(var(--dur-enter) * 6) var(--ease) infinite; }
@keyframes ui-beat { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .45; } }
/* Notices and callouts arrive from above with a spring; they never just appear. */
.wb-dock-notice, .ui-callout, .ui-toast { animation: ui-drop var(--dur-pop) var(--ease-spring) backwards; }
@keyframes ui-drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
/* A determinate meter fills smoothly as each part finishes. */
.wb-meter { display: block; height: 6px; background: var(--c-sunken); overflow: hidden; }
.wb-meter > span { display: block; height: 100%; background: var(--meter, var(--c-info)); transform-origin: left center; transform: scaleX(var(--fill, 0)); transition: transform calc(var(--dur-enter) * 3) var(--ease-out); }

/* Loading rows keep the shape of the list that is coming. They pulse with opacity only. */
.wb-skeleton { display: grid; gap: var(--sp-8); padding: var(--sp-12) var(--sp-16); }
.wb-skeleton__row { display: block; height: var(--sp-16); background: var(--c-sunken); animation: wb-pulse calc(var(--dur-enter) * 5) var(--ease) infinite alternate; }
.wb-skeleton__row:nth-child(3n + 1) { width: 100%; }
.wb-skeleton__row:nth-child(3n + 2) { width: 82%; }
.wb-skeleton__row:nth-child(3n) { width: 64%; }
@keyframes wb-pulse { from { opacity: 0.4; } to { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  :root { --dur-press: 0ms; --dur-fast: 0ms; --dur-ui: 0ms; --dur-enter: 0ms; --dur-exit: 0ms; --dur-pop: 0ms; --stagger: 0ms; }
  .ui-status[data-live]::before { animation: none; }
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 0ms !important; scroll-behavior: auto !important; }
  .ui-btn:active, .ui-segmented button:active, .ui-navlist a:active, .ui-navlist button:active, .wb-hist__item:active, .wb-entry:active { transform: none; }
  .ui-btn[aria-busy="true"]::after { animation: none; border-right-color: currentColor; }
  .wb-skeleton__row { animation: none; }
}

/* app: terminal.css */
/* Woojin Go · Terminalcore — signature layer on top of the kit (ui/tokens.css + ui/components.css).
   Load order: tokens.css → components.css → fonts.css → terminal.css. Tokens and ui-* classes only. */

body { background-color: var(--c-canvas); background-image: var(--canvas-pattern); background-size: var(--canvas-pattern-size); color: var(--c-ink); }

/* ---- prompt-style brand: ~/name▮ ------------------------------------------------------------------------------------ */
.tc-brand { display: inline-flex; align-items: center; font-family: var(--font-mono); font-weight: var(--fw-strong); letter-spacing: 0.02em; text-transform: lowercase; color: var(--c-ink); text-decoration: none; }
.tc-brand__prompt { color: var(--c-accent-2-ink); }
.tc-brand__cursor { display: inline-block; width: 0.6em; height: 1.1em; margin-left: var(--sp-4); background: var(--c-accent); }

/* ---- system status bar: real values only ------------------------------------------------------------------------------ */
.tc-status { border-top: 1px solid var(--c-line); background: var(--c-sunken); font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--c-ink-2); }
.tc-status__inner { display: flex; flex-wrap: wrap; gap: var(--sp-4) var(--sp-24); min-height: 28px; align-items: center; }
.tc-status__inner > span { white-space: nowrap; }
.tc-status__dot { display: inline-block; width: var(--sp-8); height: var(--sp-8); border-radius: 50%; background: var(--c-negative); vertical-align: middle; }
.tc-status__dot[data-ok="true"] { background: var(--c-positive); }
.tc-status__time { margin-left: auto; color: var(--c-accent-ink); font-variant-numeric: tabular-nums; }

/* ---- CRT texture: media frames and readouts only, never body text ------------------------------------------------------ */
.tc-crt { position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background-image: repeating-linear-gradient(0deg, color-mix(in srgb, var(--c-sunken) 38%, transparent) 0 1px, transparent 1px 3px); }
.tc-crt::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--sp-8);
  background-image: conic-gradient(var(--c-sunken) 25%, transparent 0 50%, var(--c-sunken) 0 75%, transparent 0); background-size: 4px 4px; }
@keyframes tc-rgb-step {
  0% { text-shadow: 2px 0 var(--c-accent), -2px 0 var(--c-accent-2); }
  50% { text-shadow: -2px 0 var(--c-accent), 2px 0 var(--c-accent-2); }
  100% { text-shadow: none; }
}
.tc-rgb-hover:hover, .tc-rgb-hover:focus-visible { animation: tc-rgb-step calc(var(--dur-enter) * 2) var(--ease) 1 both; }

/* ---- kinetic layer (js/kinetic.js) -------------------------------------------------------------------------------------- */
.tc-lens { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
[data-tc-rule] { position: relative; }
[data-tc-rule]::after { content: ""; position: absolute; left: 0; right: 0; top: calc(var(--bw-rule) * -1); height: var(--bw-rule); background: var(--c-accent); transform: scaleX(var(--tc-rule, 1)); transform-origin: left center; pointer-events: none; }
.tc-w__word { display: inline-block; white-space: nowrap; }
.tc-w__c { display: inline-block; text-align: center; }
.tc-ticker__rail { overflow: hidden; border-block: var(--bw-control) solid var(--c-line); background: var(--c-canvas); padding-block: var(--sp-8); }
.tc-ticker__track { white-space: nowrap; width: max-content; font-family: var(--font-mono); font-size: var(--fs-sm); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--c-ink-2); text-overflow: clip; }
.ui-footer .ui-label { color: var(--c-canvas); }
.tc-ticker__beat { display: block; width: 64px; height: 2px; margin-top: var(--sp-8); background: var(--c-accent-2); transform-origin: left center; opacity: 0.4; }

/* ---- signature mark link ------------------------------------------------------------------------------------------------- */
.tc-signature { display: inline-flex; color: inherit; text-decoration: none; }
.tc-signature svg { height: var(--sp-48); width: auto; }
.tc-signature:hover, .tc-signature:focus-visible { color: var(--c-accent); }
.tc-signature:focus-visible { outline: var(--bw-control) solid var(--c-focus); outline-offset: var(--sp-4); }

@media (prefers-reduced-motion: reduce) {
  .tc-rgb-hover:hover, .tc-rgb-hover:focus-visible { animation: none; }
  .tc-lens { display: none; }
}

/* app: workbench.css */
/* Workbench layout on the Woojin Go Terminalcore kit. Tokens only: no literal colours, fonts or off-scale sizes.
   Rules held: square corners, 2px frames, 3px section rules, quick eased motion, colour for status and the primary action only. */
:root {
  --wb-agent-w: calc(var(--sp-80) * 4);
  --wb-settings-w: calc(var(--sp-96) * 7);
  --wb-rail-w: calc(var(--sp-48) * 4);
}
.wb-shell { font-size: var(--fs-md); }
.wb-screen { display: grid; gap: var(--sp-12); align-content: start; min-width: 0; }
.wb-empty { color: var(--c-ink-3); font-size: var(--fs-md); margin: 0; }
.wb-pad { padding: var(--sp-12) var(--sp-16); margin: 0; }
.wb-subhead { margin: 0; font-size: var(--fs-md); font-weight: var(--fw-strong); }

/* Terminal windows: the kit's inverse title bar, kept compact for a work surface. */
.wb-shell .ui-panel--flush > .ui-panel__head { margin: 0; padding: var(--sp-4) var(--sp-12); min-height: var(--sp-32); align-items: center; }
.wb-shell .ui-panel__title { font-size: var(--fs-sm); font-family: var(--font-mono); font-weight: var(--fw-strong); letter-spacing: var(--track-label); line-height: 1.4; }
.wb-shell .ui-panel__head .ui-status { font-size: var(--fs-sm); }
:lang(ko) .wb-shell .ui-panel__title { letter-spacing: 0; }

/* ---------- Case header (header-detail moment) ---------- */
.wb-panelbar .wb-casehead { flex: 1 1 0; min-width: 0; }
.wb-casehead { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-4) var(--sp-16); min-width: 0; }
.wb-casehead__name { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: var(--fs-base); font-weight: var(--fw-strong); }
.wb-casehead__name--none { color: var(--c-ink-3); }
.wb-casehead__facts { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-4) var(--sp-16); }
.wb-casehead__dialog { flex-basis: 100%; margin: 0; }
.wb-casehead__facts .ui-status { font-size: var(--fs-sm); }
.wb-casehead__facts .ui-status .ui-num::before { content: "·"; margin: 0 var(--sp-4); font-weight: var(--fw-text); }
.wb-casehead .ui-num { font-family: var(--font-mono); font-weight: var(--fw-strong); color: var(--c-ink); }

/* ---------- Panel layout: top bar, tab strip, body, pinned agent input ---------- */
.wb-shell--panel { min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; --work-gutter: clamp(var(--sp-12), 3vw, var(--sp-24)); }
.wb-panelbar { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8) var(--sp-12); padding: var(--sp-8) var(--sp-12); background: var(--c-surface); border-bottom: var(--bw-rule) solid var(--c-frame); }
.wb-panelbar .ui-btn { flex: none; }
.wb-tabnav { background: var(--c-surface); border-bottom: var(--bw-surface) solid var(--c-frame); overflow-x: auto; scrollbar-width: none; }
.wb-tabnav::-webkit-scrollbar { display: none; }
.wb-tabnav > .ui-navlist { display: flex; gap: 0; }
/* Tabs keep their text width; on a very narrow window the strip scrolls sideways instead of overlapping. */
.wb-tabnav > .ui-navlist > li { flex: 1 0 auto; }
.wb-tabnav > .ui-navlist > li > a { justify-content: center; min-height: 44px; padding: 0 var(--sp-4); font-size: var(--fs-sm); white-space: nowrap; width: 100%; border-radius: var(--radius-xs); }
.wb-tabnav .ui-navlist [aria-current="page"] { background: var(--c-ink); color: var(--c-canvas); box-shadow: none; }
.wb-tabnav .ui-navlist a[aria-current="page"]:hover { background: var(--c-ink); color: var(--c-canvas); }
.wb-panelbody { align-content: start; min-width: 0; padding-top: var(--sp-12); gap: var(--sp-12); }
.wb-pinned { position: sticky; bottom: 0; display: flex; align-items: flex-end; gap: var(--sp-8); padding: var(--sp-8) var(--sp-12); background: var(--c-surface); border-top: var(--bw-rule) solid var(--c-frame); z-index: 10; }
.wb-pinned .wb-command { flex: 1 1 0; min-width: 0; }
.wb-agent-opener { flex: none; white-space: nowrap; }
.wb-agent-opener .ui-tag { padding: 0 var(--sp-4); }

/* ---------- Wide layout: rail, header across the top, main area, optional agent column ---------- */
.wb-shell--wide.ui-app { grid-template-columns: var(--wb-rail-w) minmax(0, 1fr); }
.wb-shell--wide .wb-topbar { gap: var(--sp-8) var(--sp-16); min-height: calc(var(--sp-48) + var(--sp-8)); padding-block: var(--sp-8); }
.wb-shell--wide .ui-app__nav { gap: var(--sp-24); padding: var(--sp-16) var(--sp-12); background: var(--c-surface); }
@media (min-width: 860px) {
  .wb-shell--wide .ui-app__nav { height: auto; min-height: 100vh; align-self: stretch; }
  .wb-shell--wide .ui-app__main { min-height: 100vh; }
}
.wb-brand { font-size: var(--fs-md); min-height: var(--sp-32); padding: 0 var(--sp-12); }
.wb-shell--wide .ui-navlist a { min-height: 40px; }
.wb-rail__foot { margin-top: auto; border-top: var(--bw-surface) solid var(--c-line); padding-top: var(--sp-8); }
.wb-body { display: grid; grid-template-columns: minmax(0, 1fr); flex: 1; min-width: 0; align-items: start; }
.wb-body--agent { grid-template-columns: minmax(0, 1fr) var(--wb-agent-w); }
.wb-body > .ui-page { padding-block: var(--sp-16) var(--sp-24); gap: var(--sp-12); }
.wb-agent-column { position: sticky; top: calc(var(--sp-48) + var(--sp-16)); align-self: start; margin: var(--sp-16) var(--sp-16) var(--sp-16) 0; max-height: calc(100vh - var(--sp-96)); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
/* The column's left edge is a drag handle, just inside the panel border (the panel clips anything outside it). */
.wb-agent-splitter { position: absolute; top: 0; bottom: 0; left: 0; width: var(--sp-12); cursor: col-resize; touch-action: none; z-index: 2; }
.wb-agent-splitter::after { content: ""; position: absolute; top: var(--sp-16); bottom: var(--sp-16); left: var(--sp-4); width: var(--bw-rule); background: var(--c-line); opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }
.wb-agent-splitter:hover::after, .wb-agent-splitter:focus-visible::after { opacity: 1; background: var(--c-accent); }
.wb-agent-splitter:focus-visible { outline: var(--bw-rule) solid var(--c-accent); outline-offset: -2px; }
.wb-agent-column__body { display: grid; gap: var(--sp-12); align-content: start; padding: var(--sp-12) var(--sp-16); min-height: 0; overflow-y: auto; }
.wb-agent-column__input { padding: var(--sp-12) var(--sp-16); border-top: var(--bw-rule) solid var(--c-frame); background: var(--c-surface); }
/* The approve / discard row stays in view at the bottom of the scrolling column, never under the input. */
.wb-agent-column__body .wb-cr__actions { position: sticky; bottom: calc(-1 * var(--sp-12)); z-index: 1; padding-block: var(--sp-8); background: var(--c-surface); border-top: var(--bw-surface) solid var(--c-line); }
.wb-status { margin-top: auto; border-top: var(--bw-surface) solid var(--c-line); }
.wb-status .tc-status__inner { padding-inline: var(--work-gutter); }

/* ---------- Agent command bar ---------- */
.wb-command { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-8); align-items: end; }
.wb-command__input { min-height: 44px; font-size: var(--fs-base); resize: none; padding-block: var(--sp-8); }
.wb-agent-column .wb-command { grid-template-columns: minmax(0, 1fr); }
.wb-agent-column .wb-command .ui-btn { justify-self: end; }
.wb-agent-column .wb-command__input { min-height: calc(var(--sp-40) * 2); }

/* Buttons that cannot be used read as unavailable: flat, muted, no accent. */
.ui-btn:disabled, .ui-btn[aria-disabled="true"] { --btn-bg: var(--c-sunken); --btn-ink: var(--c-ink-3); --btn-line: var(--c-line); opacity: 1; cursor: not-allowed; }
.ui-btn:disabled:hover, .ui-btn[aria-disabled="true"]:hover { --btn-bg: var(--c-sunken); --btn-line: var(--c-line); }
.ui-btn--primary:disabled, .ui-btn--primary[aria-disabled="true"], .ui-btn--primary:disabled:hover, .ui-btn--primary[aria-disabled="true"]:hover { --btn-bg: var(--c-sunken); --btn-ink: var(--c-ink-3); --btn-line: var(--c-line); }
.ui-btn--sm { min-height: 32px; }
/* The panel is a docked desktop window, not a touch screen: 32 px targets stay (WCAG 2.2 asks for 24). */
@media (max-width: 768px) { .ui-btn--sm { min-height: 32px; } }

/* ---------- Case home ---------- */
.wb-casehome { display: grid; gap: var(--sp-12); min-width: 0; }
.wb-casehome__body { display: grid; gap: var(--sp-12); grid-template-columns: minmax(0, 1fr); min-width: 0; align-items: start; }
.wb-casehome__all { display: inline-block; margin: var(--sp-8) var(--sp-16) var(--sp-12); font-size: var(--fs-md); }
.wb-nocase { display: grid; gap: var(--sp-12); justify-items: start; padding: var(--sp-16); background: var(--c-surface); border: var(--bw-surface) solid var(--c-frame); max-width: calc(var(--sp-96) * 6); }
.wb-nocase p { margin: 0; }

/* ---------- Problems ---------- */
.wb-problems { min-width: 0; max-width: calc(var(--sp-96) * 10); }
.wb-problems__bar { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8); padding: var(--sp-4) var(--sp-8) var(--sp-4) var(--sp-16); border-bottom: var(--bw-surface) solid var(--c-line); min-height: var(--sp-40); }
.wb-problems__group + .wb-problems__group { border-top: var(--bw-rule) solid var(--c-frame); }
.wb-problems__head { margin: 0; padding: var(--sp-8) var(--sp-16); background: var(--c-canvas); border-bottom: var(--bw-surface) solid var(--c-line); font-size: var(--fs-sm); }
.wb-problems__list { min-width: 0; }
.wb-problems__list > li, .wb-problem { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-4) var(--sp-12); padding: var(--sp-8) var(--sp-16); }
.wb-problem__body { display: grid; gap: var(--sp-4); min-width: 0; flex: 1 1 calc(var(--sp-48) * 3); }
.wb-problem__title { font-size: var(--fs-md); font-weight: var(--fw-strong); overflow-wrap: anywhere; }
.wb-problem__detail, .wb-problem__source { overflow-wrap: anywhere; margin: 0; }
.wb-problem__source { font-family: var(--font-mono); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: var(--track-label); }
.wb-problem__source:lang(ko), :lang(ko) .wb-problem__source { letter-spacing: 0; text-transform: none; font-family: var(--font-text-ko); font-size: var(--fs-xs); }
.wb-problem__fix { margin: 0; font-size: var(--fs-sm); color: var(--c-ink-2); overflow-wrap: anywhere; }
.wb-problem__body > .ui-status { font-size: var(--fs-sm); }
.wb-problem__actions { display: grid; grid-template-columns: auto auto; gap: var(--sp-8); flex: none; justify-content: end; }
.wb-problem__actions [data-wb-locate] { grid-column: 1; }
.wb-problem__actions [data-wb-fix] { grid-column: 2; }
.wb-problems__list--compact > li { padding-block: var(--sp-8); }
.wb-failed { display: grid; gap: var(--sp-4); padding: var(--sp-12) var(--sp-16); border-top: var(--bw-surface) solid var(--c-line); }
.wb-failed summary { cursor: pointer; width: fit-content; }

.ui-list > li { border-bottom-color: var(--c-line); }

/* ---------- PFD (React Flow). The library's own variables point at the brand tokens, so light and dark follow the theme. ---------- */
.wb-pfd { display: grid; min-width: 0; }
.wb-pfd__bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-4) var(--sp-8); padding: var(--sp-4) var(--sp-8) var(--sp-4) var(--sp-16); border-bottom: var(--bw-surface) solid var(--c-line); background: var(--c-surface); min-height: var(--sp-40); }
.wb-pfd__lead { min-width: 0; display: flex; align-items: center; }
.wb-pfd__tools { display: flex; gap: var(--sp-8); flex: none; }

.wb-pfd__hint { align-self: center; white-space: nowrap; }
.wb-pfd .react-flow__node, .wb-pfd .react-flow__edge { cursor: pointer; }
.wb-item { display: grid; gap: var(--sp-8); padding: var(--sp-12) var(--sp-16); border-top: var(--bw-rule) solid var(--c-frame); min-width: 0; }
.wb-item__head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-8); }
.wb-item__name { font-family: var(--font-mono); font-size: var(--fs-md); }

.wb-item__kind { text-transform: none; }
.wb-item__link:hover { background: var(--c-sunken); }
.wb-item__values { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--sp-80) * 2.5), 1fr)); gap: var(--sp-4) var(--sp-16); margin: 0; }
.wb-item__row { display: flex; justify-content: space-between; gap: var(--sp-8); padding-block: var(--sp-4); border-bottom: var(--bw-surface) solid var(--c-line); min-width: 0; }
.wb-item__row dt { color: var(--c-ink-2); overflow-wrap: anywhere; }
.wb-item__row dd { margin: 0; text-align: right; white-space: nowrap; }
.wb-source { margin-left: var(--sp-8); padding: 0 var(--sp-4); border: var(--bw-surface) solid var(--c-line); white-space: nowrap; }
.wb-unapplied ul { margin: 0; padding-left: var(--sp-16); }
@media (max-width: 640px) { .wb-pfd__hint { display: none; } }
.wb-pfd__mark { gap: var(--sp-4); max-width: 100%; }
.wb-pfd__mark-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-family: var(--font-mono); }
.wb-pfd__mark-clear { appearance: none; background: none; border: 0; min-width: var(--sp-24); min-height: var(--sp-24); padding: 0 var(--sp-4); color: inherit; cursor: pointer; font-size: var(--fs-base); line-height: 1; }
.wb-legend { display: inline-flex; flex-wrap: wrap; gap: var(--sp-4) var(--sp-12); font-size: var(--fs-xs); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: var(--track-label); }
.wb-legend__item { display: inline-flex; align-items: center; gap: var(--sp-4); }
.wb-legend__item::before { content: ""; width: var(--sp-16); height: 0; border-top: var(--bw-control) solid var(--c-ink-3); }
.wb-legend__item--energy::before { border-top-style: dashed; border-top-color: var(--c-info); }
.wb-legend__item--recycle::before { border-top-style: dashed; border-top-color: var(--c-accent); }
.wb-pfd__canvas { height: calc(var(--sp-80) * 4); min-width: 0; background: var(--c-sunken); overflow: hidden; }
.wb-shell--wide .wb-pfd__canvas { height: clamp(calc(var(--sp-80) * 4), calc(100vh - var(--sp-96) * 4), calc(var(--sp-96) * 7)); }
.wb-pfd .react-flow {
  --xy-background-color: var(--c-sunken);
  --xy-background-pattern-color-default: var(--c-line);
  --xy-edge-stroke-default: var(--c-ink-3);
  --xy-edge-label-color-default: var(--c-ink-2);
  --xy-edge-label-background-color-default: var(--c-sunken);
  --xy-controls-button-background-color-default: var(--c-surface);
  --xy-controls-button-background-color-hover-default: var(--c-sunken);
  --xy-controls-button-color-default: var(--c-ink);
  --xy-controls-button-border-color-default: var(--c-frame);
  --xy-minimap-background-color-default: var(--c-surface);

  font-family: var(--font-mono);
}
/* The kit's `svg { max-width: 100% }` clamps React Flow's zero-width edge layer to nothing, and a 0-wide svg is not drawn. */
.wb-pfd svg { max-width: none; }
.wb-pfd .react-flow__edge-textbg { fill: var(--c-sunken); }
.wb-pfd .react-flow__edge-text { fill: var(--c-ink-2); font-size: var(--fs-md); font-family: var(--font-mono); }
.wb-pfd .react-flow__controls { box-shadow: none; border: var(--bw-surface) solid var(--c-frame); }

.wb-pfd .react-flow__controls-button svg { fill: currentColor; }
.wb-pfd .react-flow__minimap { border: var(--bw-surface) solid var(--c-frame); border-radius: var(--radius-xs); }
.wb-pfd-handle { opacity: 0; pointer-events: none; }
.wb-pfd-node { box-sizing: border-box; position: relative; display: flex; background: var(--c-surface); color: var(--c-ink); border: var(--bw-control) solid var(--c-frame); border-radius: var(--radius-xs); font-family: var(--font-mono); }
.wb-pfd-node--unit { width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: flex-start; gap: 0; padding: var(--sp-4) var(--sp-12); }
.wb-pfd-node__name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-lg); font-weight: var(--fw-strong); line-height: 1.3; }
.wb-pfd-node__kind { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-text-ko); font-size: var(--fs-md); color: var(--c-ink-3); line-height: 1.3; }
.wb-pfd-node__flag { position: absolute; top: calc(var(--sp-8) * -1); right: calc(var(--sp-8) * -1); display: grid; place-items: center; width: var(--sp-16); height: var(--sp-16); background: var(--c-ink); color: var(--c-canvas); font-size: var(--fs-xs); font-weight: var(--fw-strong); line-height: 1; }
.wb-pfd-node--stream { width: 100%; height: 100%; align-items: center; justify-content: center; padding: 0 var(--sp-8); font-size: var(--fs-md); background: var(--c-sunken); border-width: 1px; border-color: var(--c-line-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wb-pfd-node--energy { border-style: dashed; border-color: var(--c-info); color: var(--c-info); background: var(--c-surface); }
.wb-pfd-node--error { border-color: var(--c-negative); }
.wb-pfd-node--warning { border-color: var(--c-warning); }
.wb-pfd-node--info { border-color: var(--c-info); }
.wb-pfd-node--error .wb-pfd-node__flag { background: var(--c-negative); }
.wb-pfd-node--warning .wb-pfd-node__flag { background: var(--c-warning); }
.wb-pfd-node--info .wb-pfd-node__flag { background: var(--c-info); }
.wb-pfd-node--on { background: var(--c-ink); color: var(--c-canvas); border-color: var(--c-ink); }
.wb-pfd-node--on .wb-pfd-node__kind { color: var(--c-canvas); }
.wb-pfd-node--logic { border-style: dashed; border-color: var(--c-line-strong); background: var(--c-sunken); color: var(--c-ink-2); }
.wb-pfd-node--recycle { border-style: dashed; border-color: var(--c-accent); }
.wb-pfd__logic-flag { margin-left: var(--sp-4); color: var(--c-warning); font-weight: var(--fw-strong); }
.wb-pfd-edge--on .react-flow__edge-text { fill: var(--c-ink); font-weight: var(--fw-strong); }
/* Full screen: the frame itself goes fixed, so the canvas keeps its state. */
.wb-pfd--full { position: fixed; inset: 0; z-index: 210; background: var(--c-canvas); grid-template-rows: auto minmax(0, 1fr); }
.wb-pfd--full .wb-pfd__canvas, .wb-shell--wide .wb-pfd--full .wb-pfd__canvas { height: auto; min-height: 0; }
@media (prefers-reduced-motion: reduce) {
  .wb-pfd .react-flow__edge.animated path { animation: none; }
}

/* ---------- Versions ---------- */
.wb-versions { display: grid; gap: var(--sp-12); min-width: 0; }

.wb-versions__snap .ui-field { width: 100%; }
.wb-versions__editor { display: grid; gap: var(--sp-8); min-width: 0; }
.wb-versions__list { background: var(--c-surface); border: var(--bw-surface) solid var(--c-frame); min-width: 0; }
.wb-versions__list > li { flex-direction: column; align-items: stretch; padding: var(--sp-12) var(--sp-16); }
.wb-versions__row { display: grid; gap: var(--sp-4); min-width: 0; }
.wb-versions__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-4) var(--sp-12); }
.wb-versions__name { font-size: var(--fs-md); overflow-wrap: anywhere; }
.wb-versions__from { overflow-wrap: anywhere; }

.wb-diff-sections { display: grid; gap: var(--sp-12); min-width: 0; }

.wb-diffsec__body .ui-list > li { padding-block: var(--sp-4); }
.wb-diffsec__body .ui-stack { gap: var(--sp-8); }
.wb-more { position: relative; }
.wb-more > summary { list-style: none; cursor: pointer; }
.wb-more > summary::-webkit-details-marker { display: none; }
.wb-more__menu { position: absolute; z-index: 30; right: 0; top: 100%; display: grid; min-width: calc(var(--sp-48) * 4); padding: var(--sp-4); background: var(--c-surface); border: var(--bw-surface) solid var(--c-ink); }
.wb-more__menu .ui-btn { justify-content: flex-start; }

/* ---------- Settings ---------- */
.wb-settings { display: grid; gap: var(--sp-12); max-width: var(--wb-settings-w); }
.wb-settings__body { display: grid; gap: var(--sp-16); padding: var(--sp-16); }
.wb-choice { gap: var(--sp-4); }
.wb-providers > li { align-items: center; padding-block: var(--sp-8); }
.wb-providers__name { display: grid; gap: var(--sp-4); }
.wb-providers > li { flex-wrap: wrap; }
.wb-xai { flex: 1 1 100%; min-width: 0; }
.wb-xai__code { margin: 0; font-family: var(--font-mono); font-size: var(--fs-2xl); font-weight: var(--fw-strong); letter-spacing: 0.08em; user-select: all; overflow-wrap: anywhere; }
.wb-xai__error { overflow-wrap: anywhere; }
.wb-about { justify-items: start; gap: var(--sp-8); }
.wb-lockup { width: calc(var(--sp-96) * 2); height: auto; color: var(--c-ink); }
.ui-segmented { padding: 0; gap: 0; border: var(--bw-control) solid var(--c-control); background: var(--c-surface); }
.ui-segmented button { border-radius: var(--radius-xs); min-height: 32px; }
.ui-segmented button[aria-pressed="true"] { background: var(--c-ink); color: var(--c-canvas); box-shadow: none; }
@media (max-width: 768px) { .ui-segmented button { min-height: 32px; } }

/* ---------- New case ---------- */
.wb-newcase { display: grid; gap: var(--sp-12); min-width: 0; }
.wb-newcase > .wb-form, .wb-newcase > .wb-entries, .wb-newcase > .wb-steps, .wb-newcase > .wb-failure, .wb-newcase > .wb-away { max-width: calc(var(--sp-96) * 8); }
.wb-entries { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; border: var(--bw-surface) solid var(--c-frame); background: var(--c-surface); }
.wb-entries > li + li { border-top: var(--bw-surface) solid var(--c-line); }
.wb-entry { transition: background-color var(--dur-fast) var(--ease), transform var(--dur-press) var(--ease-out); appearance: none; width: 100%; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--sp-4) var(--sp-16); padding: var(--sp-12) var(--sp-16); border: 0; background: none; color: var(--c-ink); font: inherit; text-align: left; cursor: pointer; min-height: 44px; }
.wb-entry:hover { background: var(--c-sunken); }
.wb-entry strong { font-size: var(--fs-base); }
.wb-form { display: grid; gap: var(--sp-12); --panel-pad: var(--sp-16); }
.wb-form__words { min-height: calc(var(--sp-48) * 2); font-size: var(--fs-base); }
.wb-chips { display: flex; flex-wrap: wrap; gap: var(--sp-4); margin: 0; padding: 0; list-style: none; }
.wb-chips .ui-btn { min-height: 32px; font-weight: var(--fw-text); text-align: left; white-space: normal; border: var(--bw-surface) dashed var(--c-line-strong); }
/* New-case words examples: a title with the filter, field tabs with counts, then a grid of example cards. */
.wb-examples { display: grid; gap: var(--sp-12); min-width: 0; padding-top: var(--sp-12); border-top: var(--bw-surface) solid var(--c-line); }
.wb-examples__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-8); }
.wb-examples__head .wb-subhead { margin: 0; }
.wb-examples__filter { flex: 0 1 calc(var(--sp-96) * 2); min-width: calc(var(--sp-96) + var(--sp-48)); }
.wb-examples__cats { display: flex; flex-wrap: wrap; gap: 0; margin: 0; padding: 0; list-style: none; border-bottom: var(--bw-surface) solid var(--c-line); }
.wb-examples__cat { appearance: none; display: inline-flex; align-items: center; gap: var(--sp-8); min-height: 36px; padding: var(--sp-4) var(--sp-12); border: 0; border-bottom: var(--bw-rule) solid transparent; margin-bottom: calc(-1 * var(--bw-surface)); background: none; color: var(--c-ink-2); font: inherit; font-size: var(--fs-sm); cursor: pointer; transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
.wb-examples__cat:hover { color: var(--c-ink); }
.wb-examples__cat[aria-pressed="true"] { color: var(--c-ink); font-weight: var(--fw-strong); border-bottom-color: var(--c-accent); }
.wb-examples__cat:focus-visible { outline: var(--bw-rule) solid var(--c-focus); outline-offset: -2px; }
.wb-examples__count { min-width: var(--sp-20); padding: 0 var(--sp-4); background: var(--c-sunken); font-size: var(--fs-xs); color: var(--c-ink-3); text-align: center; }
.wb-examples__list { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--sp-96) * 2.5), 1fr)); gap: var(--sp-8); margin: 0; padding: 0; list-style: none; }
.wb-excard { appearance: none; display: grid; align-content: start; gap: var(--sp-8); width: 100%; height: 100%; min-height: calc(var(--sp-40) * 2); padding: var(--sp-12); border: var(--bw-surface) solid var(--c-line); background: var(--c-surface); color: var(--c-ink); font: inherit; text-align: left; cursor: pointer; transition: border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out), transform var(--dur-press) var(--ease-out); }
.wb-excard:hover { border-color: var(--c-accent); background: var(--c-sunken); }
.wb-excard:active { transform: translateY(1px); }
.wb-excard:focus-visible { outline: var(--bw-rule) solid var(--c-focus); outline-offset: 2px; }
.wb-excard__top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8); }
.wb-excard__no { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--c-ink-3); }
.wb-excard__text { font-size: var(--fs-sm); line-height: var(--lh-body); overflow-wrap: anywhere; }
/* Demo PFDs on the picture path: a row of thumbnails, then a larger look at the one picked. */
.wb-pfddemo { display: grid; gap: var(--sp-12); min-width: 0; padding-top: var(--sp-12); border-top: var(--bw-surface) solid var(--c-line); }
.wb-pfddemo__head { display: grid; gap: var(--sp-4); }
.wb-pfddemo__head .wb-subhead, .wb-pfddemo__head p { margin: 0; }
.wb-pfddemo__list { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--sp-80) * 2), 1fr)); gap: var(--sp-8); margin: 0; padding: 0; list-style: none; }
.wb-pfddemo__card { appearance: none; display: grid; gap: var(--sp-4); width: 100%; padding: var(--sp-4); border: var(--bw-surface) solid var(--c-line); background: var(--c-surface); color: var(--c-ink); font: inherit; text-align: left; cursor: pointer; transition: border-color var(--dur-fast) var(--ease-out); }
.wb-pfddemo__card img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
.wb-pfddemo__card:hover { border-color: var(--c-line-strong); }
.wb-pfddemo__card[aria-pressed="true"] { border-color: var(--c-accent); box-shadow: 0 0 0 var(--bw-surface) var(--c-accent); }
.wb-pfddemo__card:focus-visible { outline: var(--bw-rule) solid var(--c-focus); outline-offset: 2px; }
.wb-pfddemo__name { font-size: var(--fs-sm); overflow-wrap: anywhere; padding: 0 var(--sp-4) var(--sp-4); }
.wb-pfddemo__view { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--sp-12); margin: 0; padding: var(--sp-12); border: var(--bw-surface) solid var(--c-frame); background: var(--c-sunken); }
.wb-pfddemo__view img { display: block; width: 100%; height: auto; border: var(--bw-surface) solid var(--c-line); }
.wb-pfddemo__view figcaption { display: grid; align-content: start; gap: var(--sp-8); }
.wb-pfddemo__view figcaption .ui-btn { justify-self: start; }
@media (max-width: 720px) { .wb-pfddemo__view { grid-template-columns: minmax(0, 1fr); } }
.wb-params { display: grid; gap: var(--sp-8); border: 0; padding: 0; margin: 0; min-width: 0; }
.wb-params__grid { display: grid; gap: var(--sp-8) var(--sp-12); grid-template-columns: repeat(auto-fit, minmax(calc(var(--sp-48) * 3), 1fr)); }
.wb-params .ui-input { min-height: 40px; font-family: var(--font-mono); }
.wb-drop { display: grid; gap: var(--sp-8); padding: var(--sp-16); border: var(--bw-surface) dashed var(--c-line-strong); background: var(--c-sunken); }
.wb-preview img { max-height: calc(var(--sp-80) * 3); width: auto; border: var(--bw-surface) solid var(--c-frame); }
.wb-steps { display: grid; gap: var(--sp-4); padding: var(--sp-8) var(--sp-16); border: var(--bw-surface) solid var(--c-frame); background: var(--c-surface); }
.wb-steps__now { margin: 0; overflow-wrap: anywhere; }
.wb-steps__now > .ui-status { align-items: baseline; font-size: var(--fs-base); white-space: normal; color: var(--c-ink); }
.wb-steps__now > .ui-status::before { background: var(--status-ink, var(--c-ink-2)); transform: translateY(-1px); }
.wb-steps__count { flex: none; white-space: nowrap; font-weight: var(--fw-strong); color: var(--status-ink, var(--c-ink-2)); }
.wb-steps__what, .wb-steps__clock, .wb-steps__slow { margin: 0; overflow-wrap: anywhere; }
.wb-steps__slow { padding: var(--sp-8) var(--sp-12); font-size: var(--fs-sm); }
.wb-steps__agents { font-weight: var(--fw-text); }
.wb-steps { container-type: inline-size; }
/* The path: one rail through square marks, filled green up to the current step; names sit under their marks. */
.wb-steps__track { --mark: 24px; --rail: var(--bw-surface); display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin: var(--sp-8) 0 0; padding: var(--sp-16) 0 var(--sp-4); list-style: none; border-top: var(--bw-surface) solid var(--c-line); }
.wb-steps__track li { position: relative; display: grid; justify-items: center; align-content: start; gap: var(--sp-8); padding: 0 var(--sp-4); color: var(--c-ink-3); text-align: center; }
.wb-steps__track li::before, .wb-steps__track li::after { content: ""; position: absolute; top: calc(var(--mark) / 2 - var(--rail) / 2); height: var(--rail); background: var(--c-line-strong); }
.wb-steps__track li::before { left: 0; right: 50%; }
.wb-steps__track li::after { left: 50%; right: 0; }

.wb-steps__track [data-step-state="done"]::before, .wb-steps__track [data-step-state="done"]::after, .wb-steps__track [data-step-state="now"]::before { background: var(--c-positive); }
.wb-steps__mark { position: relative; z-index: 1; display: inline-grid; place-items: center; width: var(--mark, 20px); height: var(--mark, 20px); border: var(--bw-surface) solid var(--c-control); background: var(--c-surface); font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: var(--fw-strong); transition: background-color var(--dur-enter) var(--ease-out), border-color var(--dur-enter) var(--ease-out); }
.wb-steps__name { font-size: var(--fs-sm); line-height: var(--lh-tight); overflow-wrap: anywhere; word-break: keep-all; }
.wb-steps__track .wb-steps__agents { font-size: var(--fs-xs); line-height: var(--lh-tight); }
.wb-steps__track [data-step-state="done"] { color: var(--c-ink-2); }
.wb-steps__track [data-step-state="done"] .wb-steps__mark { border-color: var(--c-positive); background: var(--c-positive-wash); color: var(--c-positive); }
.wb-steps__track [data-step-state="now"] { color: var(--c-ink); font-weight: var(--fw-strong); }
.wb-steps__track [data-step-state="now"] .wb-steps__mark { border-color: var(--c-info); background: var(--c-info); color: var(--c-surface); box-shadow: 0 0 0 4px var(--c-info-wash); }
.wb-steps__activity { margin: 0; font-size: var(--fs-sm); color: var(--c-ink); overflow-wrap: anywhere; }
.wb-steps__heads { display: inline-grid; place-items: center; width: 16px; height: 16px; border: var(--bw-surface) solid var(--c-warning); color: var(--c-warning); font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: var(--fw-strong); line-height: 1; }
.wb-steps__guide { font-size: var(--fs-sm); color: var(--c-ink-2); }
.wb-steps__guide summary { cursor: pointer; }
.wb-steps__guide ul { margin: var(--sp-8) 0 0; padding-left: var(--sp-16); display: grid; gap: var(--sp-4); }
/* Still-working pulse: a ring that grows and fades on the running step's mark. */
.wb-steps[data-running] .wb-steps__track [data-step-state="now"] .wb-steps__mark::after { content: ""; position: absolute; inset: -4px; border: var(--bw-surface) solid var(--c-info); opacity: 0; pointer-events: none; animation: wb-steps-pulse calc(var(--dur-enter) * 11) var(--ease-out) infinite; }
@keyframes wb-steps-pulse { from { transform: scale(0.8); opacity: 0.7; } to { transform: scale(1.5); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .wb-steps[data-running] .wb-steps__track [data-step-state="now"] .wb-steps__mark::after { animation: none; } }
/* Working cue: a block sweeps along the top edge of the card while the run works. Reduced motion gets a still dashed bar; the clocks and the last-news time keep changing as text. */
.wb-steps__sweep { display: block; height: var(--sp-8); margin: calc(var(--sp-8) * -1) calc(var(--sp-16) * -1) var(--sp-4); overflow: hidden; background: var(--c-info-wash); }
.wb-steps__sweep > span { display: block; width: 25%; height: 100%; background: var(--c-info); animation: wb-install-sweep calc(var(--dur-enter) * 8) var(--ease-linear) infinite; }
@media (prefers-reduced-motion: reduce) { .wb-steps__sweep > span { animation: none; transform: none; width: 100%; background: repeating-linear-gradient(90deg, var(--c-info) 0 var(--sp-8), transparent var(--sp-8) var(--sp-16)); } }
.wb-steps__signal, .wb-steps__quiet { margin: 0; overflow-wrap: anywhere; }
.wb-steps__live { font-size: var(--fs-sm); color: var(--c-ink-2); }
.wb-steps__live summary { cursor: pointer; }
.wb-steps__facts { display: grid; gap: var(--sp-4); margin: var(--sp-8) 0; }
.wb-steps__facts > div { display: grid; grid-template-columns: minmax(calc(var(--sp-48) * 2), max-content) minmax(0, 1fr); gap: var(--sp-12); }
.wb-steps__facts dt { color: var(--c-ink-3); }
.wb-steps__facts dd { margin: 0; color: var(--c-ink); overflow-wrap: anywhere; }
.wb-steps__lines { margin: var(--sp-4) 0 0; padding-left: var(--sp-16); display: grid; gap: var(--sp-4); overflow-wrap: anywhere; }
.wb-steps__lines li:first-child { color: var(--c-ink); }
/* Too narrow for nine columns: the same path runs down the left edge. */
@container (max-width: 640px) {
  .wb-steps__track { grid-auto-flow: row; grid-auto-columns: auto; gap: var(--sp-12); padding-top: var(--sp-16); }
  .wb-steps__track li { grid-template-columns: var(--mark) 1fr; justify-items: start; align-items: center; column-gap: var(--sp-12); row-gap: 0; padding: 0; text-align: left; }
  .wb-steps__track li > :not(.wb-steps__mark) { grid-column: 2; }
  .wb-steps__track li::before, .wb-steps__track li::after { left: calc(var(--mark) / 2 - var(--rail) / 2); right: auto; width: var(--rail); height: auto; }
  .wb-steps__track li::before { top: calc(var(--sp-12) / -2); bottom: 50%; }
  .wb-steps__track li::after { top: 50%; bottom: calc(var(--sp-12) / -2); }
}
.wb-draft__body { display: grid; gap: var(--sp-12); padding: var(--sp-12) var(--sp-16) var(--sp-16); min-width: 0; }
.wb-draft__body .wb-pfd__canvas { height: calc(var(--sp-80) * 3); }
.wb-shell--wide .wb-draft__body .wb-pfd__canvas { height: calc(var(--sp-80) * 4); }
.wb-draft__body .wb-pfd { border: var(--bw-surface) solid var(--c-frame); }
.wb-assume ul { margin: var(--sp-4) 0 0; padding-left: var(--sp-16); display: grid; gap: var(--sp-4); }
.wb-assume a { overflow-wrap: anywhere; }
.wb-assume__source { margin-top: var(--sp-4); }
.wb-assume__quote { margin: var(--sp-4) 0 0; padding-left: var(--sp-12); border-left: var(--bw-rule) solid var(--c-frame); color: var(--c-ink-2); }
.wb-assume__quote blockquote { margin: var(--sp-4) 0 0; }
.wb-assume__quote summary { cursor: pointer; }
.wb-checks { display: grid; gap: var(--sp-4); border: 0; padding: 0; margin: 0; }
.wb-draft__foot { display: grid; gap: var(--sp-12); padding-top: var(--sp-12); border-top: var(--bw-rule) solid var(--c-frame); }
.wb-approve__clock { align-self: center; font-variant-numeric: tabular-nums; }
.wb-approve__clock.is-warn { color: var(--c-warning); font-weight: 600; }
.wb-failure { display: grid; gap: var(--sp-12); justify-items: start; }
.wb-failure .ui-callout { width: 100%; }
/* A long path or sentence wraps inside the card (D59); the status chip's usual one-line rule does not apply here. */
.wb-newcase .ui-status { white-space: normal; overflow-wrap: anywhere; min-width: 0; align-items: flex-start; }
.wb-newcase .ui-status::before { margin-top: 0.4em; }
.wb-newcase .ui-form-actions, .wb-newcase .ui-stack, .wb-failure > * { min-width: 0; }
.wb-newcase .ui-meta, .wb-newcase .ui-field__error { overflow-wrap: anywhere; }
.wb-topolist { display: grid; gap: var(--sp-8); }

/* ---------- Dock notice (panel layout) ---------- */
.wb-dock-notice { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8); padding: var(--sp-4) var(--sp-12); background: var(--c-info-wash); color: var(--c-ink); font-size: var(--fs-sm); border-bottom: var(--bw-surface) solid var(--c-frame); }
.wb-dock-notice .ui-btn { flex: none; }

/* A narrow panel keeps every row inside the page. */
@media (max-width: 480px) {
  .wb-versions__split { grid-template-columns: minmax(0, 1fr); }
  .wb-problem__actions { width: 100%; }
}
ul.wb-blockers { margin: var(--sp-8) 0 0; padding-left: var(--sp-20); list-style: disc; }

/* Fixed template values, file picker, callout buttons */
.wb-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(var(--sp-48) * 3), 1fr)); gap: var(--sp-8) var(--sp-16); margin: 0; padding: var(--sp-8) var(--sp-12); border: var(--bw-surface) dashed var(--c-line-strong); }
.wb-facts > div { display: grid; gap: var(--sp-4); min-width: 0; }
.wb-facts dd { margin: 0; font-family: var(--font-mono); font-size: var(--fs-md); overflow-wrap: anywhere; }
.wb-drop input[type="file"]::file-selector-button { margin-right: var(--sp-12); min-height: 32px; padding: 0 var(--sp-12); border: var(--bw-control) solid var(--c-control); border-radius: var(--radius-sm); background: var(--c-surface); color: var(--c-ink); font: inherit; font-weight: var(--fw-strong); cursor: pointer; }
.ui-callout .ui-btn, .ui-callout .ui-form-actions { justify-self: start; }
.wb-hysys-launch { display: grid; gap: var(--sp-8); justify-items: start; min-width: 0; }
.wb-hysys-launch p { margin: 0; }
.wb-hysys-launch--compact { display: inline-flex; }
.wb-hysys-launch .ui-select { max-width: 100%; }

/* ---------- Fluid width ----------
   Panel (320-480): one column, the gutter grows with the window. Mid (481-1099): the same panel, centred, with the
   case home in two columns once there is room. Wide (1100+): the rail layout above. */
.wb-diffsec__body .ui-table-wrap, .wb-diff .ui-table-wrap, .wb-versions .ui-table-wrap, .wb-agent .ui-table-wrap { min-width: 0; max-width: 100%; overflow-x: auto; }
.wb-diffsec__body, .wb-diff, .wb-versions__diff, .wb-cr { min-width: 0; max-width: 100%; }
@media (min-width: 481px) and (max-width: 1099px) {
  .wb-panelbody { width: min(100%, calc(var(--sp-96) * 9)); margin-inline: auto; }
  .wb-tabnav > .ui-navlist { max-width: calc(var(--sp-96) * 9); margin-inline: auto; }
}

  .wb-casehome__body { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
}
/* On touch widths the primary actions and the header menu get a full-size target; the quiet 32 px buttons stay. */
@media (max-width: 768px) {
  .ui-btn--primary, .wb-headmenu > summary { min-height: 44px; }
}
.wb-versions__row > a.ui-meta { display: flex; align-items: center; min-height: var(--sp-32); }
/* Under 420 px the bar keeps the case name and the HYSYS button; the rest sits in the menu. */
@media (max-width: 420px) {
  .wb-panelbar { padding: var(--sp-8); gap: var(--sp-4) var(--sp-8); }
  .wb-casehead { gap: var(--sp-4) var(--sp-8); }
  .wb-tabnav > .ui-navlist > li > a { padding: 0 var(--sp-4); font-size: var(--fs-xs); }
  .wb-pinned { padding-inline: var(--sp-8); }
}
.wb-headmenu .wb-more__menu { right: 0; left: auto; max-width: calc(100vw - var(--sp-16)); }

/* ---------- Studies ---------- */
.wb-studies { display: grid; gap: var(--sp-16); min-width: 0; }
.wb-studies__bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--sp-8) var(--sp-16); }
.wb-studies__bar > .ui-meta { min-width: 0; max-width: 65ch; }
.wb-studies__list { background: var(--c-surface); border: var(--bw-surface) solid var(--c-frame); min-width: 0; }
.wb-studies__list > li { flex-direction: column; align-items: stretch; gap: var(--sp-12); padding: var(--sp-12) var(--sp-16); min-width: 0; }
.wb-studies__row { display: grid; gap: var(--sp-8); min-width: 0; }
.wb-studies__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-4) var(--sp-12); min-width: 0; }
.wb-studies__head > strong { overflow-wrap: anywhere; }
.wb-studies__live { display: grid; gap: var(--sp-4); min-width: 0; padding: var(--sp-8) var(--sp-12); border-left: 2px solid var(--c-info); background: var(--c-info-wash); }
.wb-studies__say { display: flex; align-items: baseline; gap: var(--sp-8); margin: 0; overflow-wrap: anywhere; }
.wb-studies__say > .ui-status { flex: none; }
.wb-studies__sim { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-4) var(--sp-12); }
.wb-studies__sim > .wb-meter { flex: 1 1 160px; min-width: 120px; }
.wb-studies__now { display: flex; flex-wrap: wrap; gap: var(--sp-4) var(--sp-12); margin: 0; }
.wb-studies__editor { min-width: 0; animation: ui-enter var(--dur-enter) var(--ease-out) backwards; }
.wb-studies__editor .ui-stack { padding: var(--sp-16); }
.wb-studies__editor .ui-select, .wb-studies__editor .ui-input { width: 100%; }
.wb-studies__editor fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: var(--sp-8); }
.wb-studies__chips { display: flex; flex-wrap: wrap; gap: var(--sp-4); list-style: none; margin: 0; padding: 0; }
.wb-studies__chips > li { display: inline-flex; align-items: center; gap: var(--sp-4); }
.wb-studies__var { padding: var(--sp-12); border: 1px solid var(--c-line); border-radius: var(--radius-sm); }
.wb-studies__figure { display: block; max-width: 100%; height: auto; margin-top: var(--sp-8); border: 1px solid var(--c-line); border-radius: var(--radius-sm); }
.wb-studies__range { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-8); }
.wb-studies__timeout { max-width: calc(var(--sp-96) * 2); }
.wb-studies__editor [data-wb-study-matrix] .ui-input { min-width: calc(var(--sp-48) * 2); }
.wb-studies__results { display: grid; gap: var(--sp-8); min-width: 0; animation: ui-enter var(--dur-enter) var(--ease-out) backwards; }
.wb-studies__results-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-8) var(--sp-12); }
.wb-studies__results-head > .ui-h { font-size: var(--fs-md); margin: 0; overflow-wrap: anywhere; }
.wb-studies__results tbody th { font-weight: var(--fw-medium); white-space: nowrap; }
.wb-studies__results tr[data-run-state="failed"] td.is-num, .wb-studies__results tr[data-run-state="timed_out"] td.is-num { color: var(--c-ink-3); }
.wb-study-notice { background: var(--c-positive-wash, var(--c-info-wash)); }
.wb-study-notice > span { flex: 1 1 auto; min-width: 0; }
/* Ask-back before building: a four-segment gauge of what the request gives, then the open questions with one-click suggestions. */
.wb-clarify { display: grid; gap: var(--sp-16); min-width: 0; }
.wb-clarify__head { display: grid; gap: var(--sp-4); }
.wb-clarify__head .ui-h4 { margin: 0; }
.wb-clarify__gauge { display: grid; gap: var(--sp-8); min-width: 0; }
.wb-clarify__score { display: flex; align-items: baseline; gap: var(--sp-8); margin: 0; }
.wb-clarify__count { font-family: var(--font-mono); font-size: var(--fs-lg); font-weight: var(--fw-strong); color: var(--c-info); }
.wb-clarify__bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-4); margin: 0; padding: 0; list-style: none; }

.wb-clarify__bar li[data-ok] .wb-clarify__seg::after { background: var(--c-positive); opacity: 1; transform-origin: left; animation: wb-clarify-fill var(--dur-enter) var(--ease-out) both; animation-delay: calc(var(--i, 0) * 90ms); }
.wb-clarify__name { overflow-wrap: anywhere; }
@keyframes wb-clarify-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.wb-clarify__questions { display: grid; gap: var(--sp-16); margin: 0; padding: 0; list-style: none; }
.wb-clarify__questions > li { display: grid; gap: var(--sp-8); min-width: 0; }
.wb-clarify__answer { min-height: calc(var(--sp-24) * 2.5); }
.wb-clarify__offer { appearance: none; display: grid; gap: var(--sp-4); text-align: left; font: inherit; color: var(--c-ink); background: var(--c-sunken); border: var(--bw-surface) dashed var(--c-line); padding: var(--sp-8) var(--sp-12); cursor: pointer; min-width: 0; overflow-wrap: anywhere; transition: border-color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease); }

/* ---------- Update: header pill, Settings section, install overlay ---------- */
.wb-update-pill { flex: none; gap: var(--sp-8); text-decoration: none; cursor: pointer; transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
