<!doctype html>
<html lang="ko" data-lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="HYSYS Companion을 소개 슬라이드로 훑어보고, 튜토리얼에서 직접 따라 해 보고, 화면 데모를 눌러 볼 수 있는 곳이에요.">
<title>HYSYS Companion</title>
<link rel="icon" type="image/svg+xml" href="ui-shell/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="ui-shell/favicon-32.png">
<style>
/* Colours and type follow the intro deck (intro/index.html), so the bar and the pages read as one site.
   No web fonts are loaded here: the page uses the fonts already installed on the visitor's device. */
:root {
  --font-text: "Meslo LGS NF", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
  --font-text-ko: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
  --font-mono: "Meslo LGS NF", "Pretendard", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --track-label: 0.08em;
  --bw-rule: 3px;
  --bw-surface: 2px;
  --c-canvas: #e1e2e7; --c-surface: #eceef3; --c-sunken: #d0d5e3;
  --c-ink: #1f2335; --c-ink-2: #343b58; --c-ink-3: #4c5585;
  --c-line: #b6bdd3; --c-line-strong: #3760bf; --c-control: #5d6aa3;
  --c-accent: #2459c9; --c-accent-hover: #1b48a8; --c-on-accent: #ffffff; --c-accent-wash: #d5e1f7; --c-accent-ink: #1d4fb8;
  --c-accent-2-ink: #3a6420; --c-focus: #2459c9;
  --c-warning: #7a5200; --c-warning-wash: #efe2c8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --c-canvas: #16161e; --c-surface: #1a1b26; --c-sunken: #101018;
    --c-ink: #c0caf5; --c-ink-2: #a9b1d6; --c-ink-3: #8089b3;
    --c-line: #292e42; --c-line-strong: #3b4261; --c-control: #565f89;
    --c-accent: #7aa2f7; --c-accent-hover: #9bbaff; --c-on-accent: #16161e; --c-accent-wash: #1f2a4a; --c-accent-ink: #89b4fa;
    --c-accent-2-ink: #a9dc76; --c-focus: #7dcfff;
    --c-warning: #e0af68; --c-warning-wash: #2e2618;
  }
}
:root[data-theme="dark"] {
  --c-canvas: #16161e; --c-surface: #1a1b26; --c-sunken: #101018;
  --c-ink: #c0caf5; --c-ink-2: #a9b1d6; --c-ink-3: #8089b3;
  --c-line: #292e42; --c-line-strong: #3b4261; --c-control: #565f89;
  --c-accent: #7aa2f7; --c-accent-hover: #9bbaff; --c-on-accent: #16161e; --c-accent-wash: #1f2a4a; --c-accent-ink: #89b4fa;
  --c-accent-2-ink: #a9dc76; --c-focus: #7dcfff;
  --c-warning: #e0af68; --c-warning-wash: #2e2618;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { -webkit-text-size-adjust: 100%; color-scheme: light dark; }
body {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  overflow: hidden;
  background: var(--c-canvas);
  color: var(--c-ink);
  font-family: var(--font-text);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: var(--c-accent-ink); text-underline-offset: .2em; }
:focus-visible { outline: 3px solid var(--c-focus); outline-offset: -3px; }
html[data-lang="ko"] [lang="en"], html[data-lang="en"] [lang="ko"] { display: none !important; }
[lang="ko"] { font-family: var(--font-text-ko); word-break: keep-all; overflow-wrap: anywhere; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Bar ---------- */
.bar {
  flex: none;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto auto auto;
  grid-template-areas: "brand tabs cta dl open lang";
  align-items: center; column-gap: 12px;
  min-height: 60px; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  background: var(--c-surface);
  border-bottom: var(--bw-surface) solid var(--c-line);
}
.brand { grid-area: brand; display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--c-ink); min-height: 44px; }
.brand img { width: 30px; height: 30px; display: block; }
.shellp { font: 700 16px/1 var(--font-mono); white-space: nowrap; }
.shellp b { color: var(--c-accent-2-ink); font-weight: 700; }
.shellp .cur { display: inline-block; width: .6em; height: 1.05em; margin-left: .2em; vertical-align: -.15em; background: var(--c-accent); }

.tabs { grid-area: tabs; display: flex; align-items: stretch; gap: 4px; min-width: 0; margin-left: 12px; }
.tab {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 60px; padding: 0 16px; margin: 0;
  background: none; border: 0; border-radius: 0; cursor: pointer;
  font-size: 16px; font-weight: 600; line-height: 1.2; white-space: nowrap;
  color: var(--c-ink-3);
  box-shadow: inset 0 calc(-1 * var(--bw-rule)) 0 transparent;
}
.tab:hover { color: var(--c-accent-ink); background: color-mix(in srgb, var(--c-accent-wash) 55%, transparent); }
.tab[aria-selected="true"] { color: var(--c-ink); font-weight: 800; box-shadow: inset 0 calc(-1 * var(--bw-rule)) 0 var(--c-accent); }

.cta {
  grid-area: cta; display: inline-flex; align-items: center; gap: 8px;
  min-height: 44px; padding: 0 16px;
  background: var(--c-accent); color: var(--c-on-accent);
  border: var(--bw-surface) solid var(--c-accent); border-radius: 0;
  font-size: 15px; font-weight: 700; line-height: 1.2; text-decoration: none; white-space: nowrap;
}
.cta:hover { background: var(--c-accent-hover); border-color: var(--c-accent-hover); }
.cta svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: square; flex: none; }
.cta[hidden] { display: none; }
.ctl {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-width: 44px; height: 44px; padding: 0 12px;
  background: var(--c-surface); border: var(--bw-surface) solid var(--c-control); border-radius: 0;
  font: 700 14px/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase;
  cursor: pointer; color: var(--c-ink); text-decoration: none;
}
.ctl:hover { border-color: var(--c-accent); color: var(--c-accent-ink); }
.ctl svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; }
.ctl .on { color: var(--c-accent-ink); }
.ctl .off { color: var(--c-ink-3); font-weight: 400; }
#open { grid-area: open; }
#dl { grid-area: dl; width: auto; gap: 6px; padding: 0 12px; font: 700 14px/1 var(--font-mono); text-decoration: none; }
#dl[hidden] { display: none; }
#btnLang { grid-area: lang; }

.note {
  flex: none; margin: 0; padding: 8px 16px;
  background: var(--c-warning-wash); color: var(--c-ink);
  border-bottom: var(--bw-surface) solid var(--c-line);
  font-size: 14px; line-height: 1.5;
}
.note[hidden] { display: none; }

/* ---------- Pages ---------- */
.pages { position: relative; flex: 1 1 auto; min-height: 0; background: var(--c-canvas); }
.panel { position: absolute; inset: 0; }
.panel[data-active="false"] { visibility: hidden; pointer-events: none; }
.panel iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--c-canvas); }

noscript .nojs { margin: 0; padding: 12px 16px; background: var(--c-warning-wash); font-size: 15px; line-height: 1.6; }

/* ---------- Phone ---------- */
@media (max-width: 720px) {
  .bar {
    grid-template-columns: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "brand tabs dl lang" "cta cta cta cta";
    column-gap: 8px; padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right));
    min-height: 0;
  }
  .shellp { display: none; }
  .brand { min-height: 52px; }
  .tabs { margin-left: 0; gap: 0; }
  .tab { min-height: 52px; padding: 0 9px; font-size: 15px; flex: 1 1 auto; }
  #open { display: none; }
  #dl { padding: 0; width: 44px; justify-content: center; }
  #dl .dlt { display: none; }
  .cta { justify-content: center; margin: 0 0 8px; }
  .cta[hidden] { display: none; }
}
@media (max-width: 380px) {
  .tab { padding: 0 6px; font-size: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .tab, .cta, .ctl { transition: color .15s ease, background-color .15s ease, border-color .15s ease; }
}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="#intro" data-label-ko="HYSYS Companion, 소개로 가기" data-label-en="HYSYS Companion, go to the intro" aria-label="HYSYS Companion, 소개로 가기">
    <img src="ui-shell/favicon.svg" alt="" width="30" height="30">
    <span class="shellp"><b>~/</b>hysys-companion<span class="cur" aria-hidden="true"></span></span>
  </a>

  <div class="tabs" role="tablist" id="tabs" data-label-ko="HYSYS Companion 안내" data-label-en="HYSYS Companion guides" aria-label="HYSYS Companion 안내">
    <button class="tab" role="tab" type="button" id="tab-intro" data-tab="intro" aria-controls="panel-intro" aria-selected="true" tabindex="0"><span lang="ko">소개</span><span lang="en">Intro</span></button>
    <button class="tab" role="tab" type="button" id="tab-tutorial" data-tab="tutorial" aria-controls="panel-tutorial" aria-selected="false" tabindex="-1"><span lang="ko">튜토리얼</span><span lang="en">Tutorial</span></button>
    <button class="tab" role="tab" type="button" id="tab-demo" data-tab="demo" aria-controls="panel-demo" aria-selected="false" tabindex="-1"><span lang="ko">화면 데모</span><span lang="en">Screen demo</span></button>
  </div>

  <a class="cta" id="cta" href="#tutorial">
    <span lang="ko">튜토리얼 시작하기</span><span lang="en">Start the tutorial (Korean)</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 H19 M13 6 L19 12 L13 18"/></svg>
  </a>
  <a class="ctl" id="dl" href="download/HYSYS-Companion-intro.html" download="HYSYS-Companion-intro.html" data-label-ko="이 페이지를 HTML 파일로 내려받기 (인터넷 없이 열려요)" data-label-en="Download this page as an HTML file (opens offline)" aria-label="이 페이지를 HTML 파일로 내려받기 (인터넷 없이 열려요)" title="HTML 내려받기">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 V15 M7 10 L12 15 L17 10 M5 20 H19"/></svg><span class="dlt">HTML</span>
  </a>
  <a class="ctl" id="open" href="intro/" target="_blank" rel="noopener" data-label-ko="이 페이지를 새 탭에서 열기" data-label-en="Open this page in a new tab" aria-label="이 페이지를 새 탭에서 열기">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4 H20 V10 M20 4 L11 13 M18 14 V20 H4 V6 H10"/></svg>
  </a>
  <button class="ctl" id="btnLang" type="button" data-label-ko="Switch to English" data-label-en="한국어로 보기" aria-label="Switch to English"><span class="lk">KO</span><span class="le">EN</span></button>
</header>

<p class="note" id="note" role="note" hidden>
  <span lang="en">The tutorial is available in Korean only.</span>
</p>

<main class="pages" id="pages">
  <section class="panel" id="panel-intro" role="tabpanel" aria-labelledby="tab-intro" data-active="true">
    <iframe id="frame-intro" data-tab="intro" data-src="intro/" title="HYSYS Companion 소개 슬라이드" data-label-ko="HYSYS Companion 소개 슬라이드" data-label-en="HYSYS Companion intro slides" allow="fullscreen"></iframe>
  </section>
  <section class="panel" id="panel-tutorial" role="tabpanel" aria-labelledby="tab-tutorial" data-active="false" inert>
    <iframe id="frame-tutorial" data-tab="tutorial" data-src="tutorial/" title="HYSYS Companion 튜토리얼" data-label-ko="HYSYS Companion 튜토리얼" data-label-en="HYSYS Companion tutorial" allow="fullscreen"></iframe>
  </section>
  <section class="panel" id="panel-demo" role="tabpanel" aria-labelledby="tab-demo" data-active="false" inert>
    <iframe id="frame-demo" data-tab="demo" data-src="ui-shell/" title="HYSYS Companion 화면 데모" data-label-ko="HYSYS Companion 화면 데모" data-label-en="HYSYS Companion screen demo" allow="fullscreen"></iframe>
  </section>
  <noscript>
    <p class="nojs"><a href="intro/">소개</a> · <a href="tutorial/">튜토리얼</a> · <a href="ui-shell/">화면 데모</a></p>
  </noscript>
</main>

<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var ORDER = ["intro", "tutorial", "demo"];
  var TITLE = {
    intro: { ko: "소개", en: "Intro" },
    tutorial: { ko: "튜토리얼", en: "Tutorial" },
    demo: { ko: "화면 데모", en: "Screen demo" }
  };
  var PATH = { intro: "intro/", tutorial: "tutorial/", demo: "ui-shell/" };
  var tabs = {}, panels = {}, frames = {};
  ORDER.forEach(function (id) {
    tabs[id] = document.getElementById("tab-" + id);
    panels[id] = document.getElementById("panel-" + id);
    frames[id] = document.getElementById("frame-" + id);
  });
  var cta = document.getElementById("cta");
  var note = document.getElementById("note");
  var openLink = document.getElementById("open");
  var dl = document.getElementById("dl");
  var FILE = { intro: "HYSYS-Companion-intro.html", tutorial: "HYSYS-Companion-tutorial.html" };
  var current = null;

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function lang() { return root.getAttribute("data-lang"); }

  /* ---------- language ---------- */
  function relabel() {
    var L = lang();
    document.querySelectorAll("[data-label-" + L + "]").forEach(function (el) { el.setAttribute("aria-label", el.getAttribute("data-label-" + L)); });
    ORDER.forEach(function (id) { frames[id].setAttribute("title", frames[id].getAttribute("data-label-" + L)); });
    var lb = document.getElementById("btnLang");
    lb.querySelector(".lk").className = "lk " + (L === "ko" ? "on" : "off");
    lb.querySelector(".le").className = "le " + (L === "en" ? "on" : "off");
    if (current) document.title = TITLE[current][L] + " · HYSYS Companion";
    updateChrome();
  }
  function syncIntroLang() {
    try {
      var d = frames.intro.contentDocument;
      if (d && d.documentElement.getAttribute("data-lang") !== lang()) {
        var b = d.getElementById("btnLang");
        if (b) b.click();
      }
    } catch (e) { /* the page is not ready yet: it starts in the right language through ?lang= */ }
  }
  function setLang(L) {
    root.setAttribute("data-lang", L); root.lang = L;
    store("hc-hub-lang", L);
    relabel();
    syncIntroLang();
  }

  /* ---------- theme: follow the system, or the page on show when it was set there ---------- */
  function adoptTheme() {
    var f = current && frames[current], t = null;
    try { t = f.contentDocument.documentElement.getAttribute("data-theme"); } catch (e) { /* not loaded yet */ }
    if (t === "light" || t === "dark") root.setAttribute("data-theme", t); else root.removeAttribute("data-theme");
  }

  /* ---------- tabs ---------- */
  function updateChrome() {
    var L = lang();
    cta.hidden = current !== "intro";
    note.hidden = !(L === "en" && current === "tutorial");
    openLink.setAttribute("href", PATH[current || "intro"]);
    var file = FILE[current || "intro"];
    dl.hidden = !file;  // the screen demo is many files
    if (file) { dl.setAttribute("href", "download/" + file); dl.setAttribute("download", file); }
    dl.setAttribute("title", lang() === "en" ? "Download HTML" : "HTML 내려받기");
  }

  function loadFrame(id) {
    var f = frames[id];
    if (f.getAttribute("src")) return;
    var src = f.getAttribute("data-src");
    if (id === "intro" && lang() === "en") src += "?lang=en";
    f.setAttribute("src", src);
  }

  function select(id, fromHash) {
    if (ORDER.indexOf(id) < 0) id = "intro";
    ORDER.forEach(function (k) {
      var on = k === id;
      tabs[k].setAttribute("aria-selected", on ? "true" : "false");
      tabs[k].tabIndex = on ? 0 : -1;
      panels[k].setAttribute("data-active", on ? "true" : "false");
      if (on) panels[k].removeAttribute("inert"); else panels[k].setAttribute("inert", "");
    });
    current = id;
    loadFrame(id);
    adoptTheme();
    document.title = TITLE[id][lang()] + " · HYSYS Companion";
    updateChrome();
    if (!fromHash && location.hash !== "#" + id) location.hash = id;
  }

  function fromHash() {
    var h = location.hash.replace(/^#\/?/, "").toLowerCase();
    return ORDER.indexOf(h) >= 0 ? h : "intro";
  }

  ORDER.forEach(function (id) {
    tabs[id].addEventListener("click", function () { select(id); });
  });
  document.getElementById("tabs").addEventListener("keydown", function (e) {
    var i = ORDER.indexOf(current), n = -1;
    if (e.key === "ArrowRight") n = (i + 1) % ORDER.length;
    else if (e.key === "ArrowLeft") n = (i + ORDER.length - 1) % ORDER.length;
    else if (e.key === "Home") n = 0;
    else if (e.key === "End") n = ORDER.length - 1;
    if (n < 0) return;
    e.preventDefault();
    select(ORDER[n]);
    tabs[ORDER[n]].focus();
  });
  /* links that point at another tab (the brand, the start button) change the tab; the hash does the rest */
  window.addEventListener("hashchange", function () { select(fromHash(), true); if (document.activeElement === document.body) tabs[current].focus(); });
  document.getElementById("btnLang").addEventListener("click", function () { setLang(lang() === "ko" ? "en" : "ko"); });

  /* ---------- pages inside the frames ---------- */
  function routeOf(pathname) {
    if (/\/intro\/(index\.html)?$/.test(pathname)) return "intro";
    if (/\/tutorial\/(index\.html)?$/.test(pathname)) return "tutorial";
    if (/\/ui-shell\/(index\.html)?$/.test(pathname)) return "demo";
    return null;
  }
  ORDER.forEach(function (id) {
    frames[id].addEventListener("load", function () {
      var d;
      try { d = frames[id].contentDocument; if (!d || !d.documentElement) return; } catch (e) { return; }
      /* a link inside a page that leads to another of these pages switches the tab instead of loading it inside the frame */
      d.addEventListener("click", function (e) {
        if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
        if (!a || (a.target && a.target !== "_self")) return;
        var u; try { u = new URL(a.href, d.baseURI); } catch (x) { return; }
        var r = u.origin === location.origin ? routeOf(u.pathname) : null;
        if (r && r !== id) { e.preventDefault(); select(r); tabs[r].focus(); }
      });
      /* keep the bar's colours in step when the theme is changed inside a page */
      try {
        new MutationObserver(function () { if (current === id) adoptTheme(); })
          .observe(d.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
      } catch (e) { /* the bar keeps following the system */ }
      if (current === id) adoptTheme();
      if (id === "intro") syncIntroLang();
    });
  });

  /* ---------- start ---------- */
  var saved = store("hc-hub-lang");
  root.setAttribute("data-lang", saved === "en" ? "en" : "ko");
  root.lang = lang();
  relabel();
  select(fromHash(), true);
})();
</script>
</body>
</html>
